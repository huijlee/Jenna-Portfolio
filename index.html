  'My Design Approach': 'デザインのアプローチ',
  'Present': '現在',
  'Show less': '閉じる',
  'Show all': 'すべて表示',
  'A constellation of moments shaping how I see and design.': 'ひとつひとつの経験が、観察から生まれた物語を語っています。',
  'Please enter your name': 'お名前を入力してください',
  'Please enter your email': 'メールアドレスを入力してください',
  'That email address doesn’t look right': 'メールアドレスの形式が正しくありません',
  'Please enter a message': 'メッセージを入力してください',
  'Whether it’s a collaboration, a design consultation or just a chat about design, I’d love to hear from you.': 'お仕事のご相談、デザインについてのご質問、ちょっとした雑談まで、お気軽にご連絡ください。',
  'I usually reply within 24 hours.': '通常24時間以内に返信します。',
  'Taipei, Taiwan': '台湾・台北',
  'Your name': 'お名前',
  'Tell me about your project…': 'ご相談内容やプロジェクトについてお聞かせください…',
  'Got your message — I’ll get back to you soon.': 'メッセージを受け取りました。できるだけ早くご返信します。',
  'Sending…': '送信中…',
  '✓ Message sent': '✓ 送信しました',
  'Send Message': 'メッセージを送る',
  'Home': 'ホーム',
  'Work': '作品',
  'About': 'プロフィール',
  'Experience': '経歴',
  'Contact': 'お問い合わせ',
  'Jenna — Home': 'Jenna — ホーム',
  'Switch to light mode': 'ライトモードに切り替え',
  'Switch to dark mode': 'ダークモードに切り替え',
  'Resume': '履歴書',
  'Open menu': 'メニューを開く',
  'Close menu': 'メニューを閉じる',
  '↓ Download Resume': '↓ 履歴書をダウンロード',
};

// ══════════════════════════════
// FOG — drifting clouds & mist (WebGL, domain-warped noise)
// ══════════════════════════════
const FOG_FS = `
precision mediump float;
uniform vec2 uRes;
uniform float uTime;
uniform vec2 uMouse;
uniform float uDark;
uniform vec3 uGlow;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec2 p){
  vec2 i=floor(p),f=fract(p);
  vec2 u=f*f*(3.0-2.0*f);
  return mix(mix(hash(i),hash(i+vec2(1.0,0.0)),u.x),mix(hash(i+vec2(0.0,1.0)),hash(i+vec2(1.0,1.0)),u.x),u.y);
}
float fbm(vec2 p){
  float v=0.0,a=0.5;
  mat2 m=mat2(1.6,1.2,-1.2,1.6);
  for(int i=0;i<5;i++){v+=a*noise(p);p=m*p;a*=0.5;}
  return v;
}
void main(){
  vec2 uv=gl_FragCoord.xy/uRes;
  float asp=uRes.x/uRes.y;
  vec2 p=vec2(uv.x*asp*1.1,uv.y*1.9)+uMouse*0.05;
  float t=uTime*0.022;
  vec2 q=vec2(fbm(p+vec2(t,0.0)),fbm(p+vec2(-t*0.7,t*0.25)+5.2));
  float f=fbm(p+1.8*q+vec2(t*0.6,-t*0.15));
  float f2=fbm(p*0.55+q+vec2(-t*0.35,t*0.1)+9.1);
  vec3 top=mix(vec3(0.984,0.980,0.961),vec3(0.065,0.075,0.10),uDark);
  vec3 bot=mix(vec3(0.835,0.839,0.816),vec3(0.028,0.032,0.047),uDark);
  vec3 col=mix(bot,top,smoothstep(0.0,1.0,uv.y));
  vec3 cloud=mix(vec3(1.0,1.0,0.995),vec3(0.30,0.36,0.44),uDark);
  vec3 haze=mix(vec3(0.80,0.87,0.92),vec3(0.18,0.27,0.36),uDark);
  float amt=mix(0.72,0.38,uDark);
  col=mix(col,haze,smoothstep(0.45,0.82,f2)*0.32);
  col=mix(col,cloud,smoothstep(0.38,0.86,f)*amt);
  float band=smoothstep(0.5,0.0,uv.y)*smoothstep(0.32,0.72,f2);
  col=mix(col,cloud,band*amt*0.6);
  // cursor glow — a soft lantern in the mist
  vec2 gd=(uv-uGlow.xy)*vec2(asp,1.0);
  float gr=dot(gd,gd);
  // kept faint on purpose: it must never wash out the text above it
  float halo=exp(-gr/0.011)*uGlow.z;
  float core=exp(-gr/0.0025)*uGlow.z;
  vec3 tint=mix(vec3(0.80,0.88,0.95),vec3(0.38,0.52,0.66),uDark);
  col=mix(col,tint,halo*0.15*(1.0-uDark));
  col+=tint*halo*0.13*uDark;
  col+=cloud*smoothstep(0.35,0.8,f)*halo*0.04;
  col=mix(col,mix(vec3(1.0,0.97,0.94),vec3(0.62,0.72,0.82),uDark),core*mix(0.12,0.06,uDark));
  gl_FragColor=vec4(col,1.0);
}`;

function FogCanvas() {
  useEffect(() => {
    const canvas = document.getElementById('fog-canvas');
    if (!canvas) return;
    const gl = canvas.getContext('webgl', { antialias: false, alpha: false });
    if (!gl) return; // CSS gradient fallback stays visible
    const mk = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
    const prog = gl.createProgram();
    gl.attachShader(prog, mk(gl.VERTEX_SHADER, 'attribute vec2 a;void main(){gl_Position=vec4(a,0.0,1.0);}'));
    gl.attachShader(prog, mk(gl.FRAGMENT_SHADER, FOG_FS));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return;
    gl.useProgram(prog);
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const aLoc = gl.getAttribLocation(prog, 'a');
    gl.enableVertexAttribArray(aLoc);
    gl.vertexAttribPointer(aLoc, 2, gl.FLOAT, false, 0, 0);
    const U = n => gl.getUniformLocation(prog, n);
    const uRes = U('uRes'), uTime = U('uTime'), uMouse = U('uMouse'), uDark = U('uDark'), uGlow = U('uGlow');

    const SCALE = 0.5; // render at half-res; the blur suits fog and keeps it light
    const resize = () => {
      canvas.width = Math.max(1, Math.round(window.innerWidth * SCALE));
      canvas.height = Math.max(1, Math.round(window.innerHeight * SCALE));
      gl.viewport(0, 0, canvas.width, canvas.height);
    };
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const isDark = () => document.documentElement.getAttribute('data-theme') === 'dark' ? 1 : 0;
    const mouse = { x: 0, y: 0 }, sm = { x: 0, y: 0 };
    const glowT = { x: 0.5, y: 0.5, s: 0 }, glow = { x: 0.5, y: 0.5, s: 0 };
    let dark = isDark(), raf, last = 0;
    const t0 = performance.now();

    const frame = now => {
      raf = requestAnimationFrame(frame);
      // ~30fps is plenty for slow fog; go to 60fps while the cursor glow is moving
      const moving = Math.abs(glowT.x - glow.x) + Math.abs(glowT.y - glow.y) > 0.001 || Math.abs(glowT.s - glow.s) > 0.01;
      if (now - last < (moving ? 15 : 33)) return;
      last = now;
      dark += (isDark() - dark) * 0.08;
      if (!reduce) { sm.x += (mouse.x - sm.x) * 0.03; sm.y += (mouse.y - sm.y) * 0.03; }
      glow.x += (glowT.x - glow.x) * 0.16;
      glow.y += (glowT.y - glow.y) * 0.16;
      glow.s += (glowT.s - glow.s) * 0.07;
      gl.uniform3f(uGlow, glow.x, glow.y, reduce ? 0 : glow.s);
      gl.uniform2f(uRes, canvas.width, canvas.height);
      gl.uniform1f(uTime, reduce ? 14.0 : (now - t0) / 1000);
      gl.uniform2f(uMouse, sm.x, sm.y);
      gl.uniform1f(uDark, dark);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    };
    const onMove = e => {
      mouse.x = e.clientX / window.innerWidth - 0.5;
      mouse.y = 0.5 - e.clientY / window.innerHeight;
      glowT.x = e.clientX / window.innerWidth;
      glowT.y = 1 - e.clientY / window.innerHeight;
      if (glow.s < 0.02) { glow.x = glowT.x; glow.y = glowT.y; } // appear where the cursor enters
      glowT.s = 1;
    };
    const onLeave = () => { glowT.s = 0; };
    document.documentElement.addEventListener('mouseleave', onLeave);

    resize();
    raf = requestAnimationFrame(frame);
    window.addEventListener('resize', resize);
    window.addEventListener('mousemove', onMove);
    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener('resize', resize);
      window.removeEventListener('mousemove', onMove);
      document.documentElement.removeEventListener('mouseleave', onLeave);
    };
  }, []);
  return null;
}

// (legacy particle background — no longer mounted)
function ParticleCanvas() {
  useEffect(() => {
    const canvas = document.getElementById('particle-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let W, H, raf, t0 = performance.now();
    const ACCENT = [143, 190, 220];
    const COOL = [150, 168, 188];
    const N = 180;
    const CONNECT_DIST = 100;
    const MOUSE_INFLUENCE = 200;

    const mouse = { x: -9999, y: -9999 };
    const smoothed = { x: -9999, y: -9999 };

    const pts = Array.from({ length: N }, () => ({
      x: Math.random(),
      y: Math.random(),
      vx: (Math.random() - 0.5) * 0.04,
      vy: (Math.random() - 0.5) * 0.04,
      r: 0.7 + Math.random() * 1.2,
      baseAlpha: 0.18 + Math.random() * 0.32,
      phase: Math.random() * Math.PI * 2,
      breath: 1.2 + Math.random() * 1.4,
      accent: Math.random() > 0.45,
    }));

    const resize = () => {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };

    const draw = () => {
      const t = (performance.now() - t0) / 1000;
      ctx.clearRect(0, 0, W, H);

      // smoothed mouse for delayed organic feel
      if (mouse.x > -1000) {
        if (smoothed.x < -1000) { smoothed.x = mouse.x; smoothed.y = mouse.y; }
        else {
          smoothed.x += (mouse.x - smoothed.x) * 0.045;
          smoothed.y += (mouse.y - smoothed.y) * 0.045;
        }
      }

      // update positions
      pts.forEach(p => {
        // gentle drift
        p.x += p.vx / W;
        p.y += p.vy / H;
        if (p.x < -0.05) p.x = 1.05;
        if (p.x > 1.05) p.x = -0.05;
        if (p.y < -0.05) p.y = 1.05;
        if (p.y > 1.05) p.y = -0.05;
      });

      const screen = pts.map(p => ({ p, sx: p.x * W, sy: p.y * H }));

      // connections — only near mouse, very faint
      if (smoothed.x > -1000) {
        for (let i = 0; i < screen.length; i++) {
          const a = screen[i];
          const dax = a.sx - smoothed.x, day = a.sy - smoothed.y;
          const da = Math.sqrt(dax * dax + day * day);
          if (da > MOUSE_INFLUENCE) continue;
          for (let j = i + 1; j < screen.length; j++) {
            const b = screen[j];
            const dx = a.sx - b.sx, dy = a.sy - b.sy;
            const d = Math.sqrt(dx * dx + dy * dy);
            if (d > CONNECT_DIST) continue;
            const proximity = 1 - da / MOUSE_INFLUENCE;
            const alpha = (1 - d / CONNECT_DIST) * proximity * 0.14;
            ctx.beginPath();
            ctx.moveTo(a.sx, a.sy);
            ctx.lineTo(b.sx, b.sy);
            ctx.strokeStyle = `rgba(${ACCENT[0]},${ACCENT[1]},${ACCENT[2]},${alpha})`;
            ctx.lineWidth = 0.4;
            ctx.stroke();
          }
        }
      }

      // particles
      screen.forEach(({ p, sx, sy }) => {
        const breath = 0.5 + 0.5 * Math.sin(t * p.breath + p.phase);
        const baseAlpha = p.baseAlpha * (0.6 + breath * 0.6);
        // mouse proximity gentle boost
        const mdx = sx - smoothed.x, mdy = sy - smoothed.y;
        const md = Math.sqrt(mdx * mdx + mdy * mdy);
        const boost = smoothed.x > -1000 ? Math.max(0, 1 - md / MOUSE_INFLUENCE) : 0;
        const alpha = Math.min(baseAlpha + boost * 0.3, 0.85);
        const r = p.r + boost * 0.6;
        const c = p.accent ? ACCENT : COOL;
        ctx.beginPath();
        ctx.arc(sx, sy, r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},${alpha})`;
        ctx.fill();
      });

      raf = requestAnimationFrame(draw);
    };

    const onMove = e => { mouse.x = e.clientX; mouse.y = e.clientY; };
    const onLeave = () => { mouse.x = -9999; mouse.y = -9999; };

    resize();
    draw();
    window.addEventListener('resize', resize);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseleave', onLeave);

    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener('resize', resize);
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseleave', onLeave);
    };
  }, []);
  return null;
}

// TYPEWRITER (kept)
// ══════════════════════════════
function Typewriter({ words }) {
  const [display, setDisplay] = useState('');
  const [wIdx, setWIdx] = useState(0);
  const [charIdx, setCharIdx] = useState(0);
  const [del, setDel] = useState(false);
  useEffect(() => {
    const word = words[wIdx];
    const delay = del ? 50 : charIdx === word.length ? 1800 : 90;
    const t = setTimeout(() => {
      if (!del) { if (charIdx < word.length) { setDisplay(word.slice(0, charIdx + 1)); setCharIdx(c => c + 1); } else setDel(true); }
      else { if (charIdx > 0) { setDisplay(word.slice(0, charIdx - 1)); setCharIdx(c => c - 1); } else { setDel(false); setWIdx(i => (i + 1) % words.length); } }
    }, delay);
    return () => clearTimeout(t);
  }, [display, wIdx, charIdx, del]);
  return <span className="hero-h1-typewriter">{display}<span className="hero-cursor"></span></span>;
}

// SCROLL SPY TOC
// ══════════════════════════════
function CsToc({ mainRef, items }) {
  const [active, setActive] = useState(items[0]?.id);
  useEffect(() => {
    const container = mainRef?.current;
    if (!container) return;
    const obs = new IntersectionObserver(
      entries => { entries.forEach(e => { if (e.isIntersecting) setActive(e.target.id); }); },
      { root: container, rootMargin: '-15% 0px -65% 0px', threshold: 0 }
    );
    items.forEach(({ id }) => { const el = container.querySelector('#' + id); if (el) obs.observe(el); });
    return () => obs.disconnect();
  }, [mainRef, items]);
  const scrollTo = id => {
    const container = mainRef?.current;
    const el = container?.querySelector('#' + id);
    if (!el || !container) return;
    container.scrollTo({ top: el.offsetTop - 100, behavior: 'smooth' });
  };
  return (
    <nav className="cs-toc" aria-label="Contents">
      <div className="cs-toc-label">Contents</div>
      {items.map(item => (
        <button key={item.id} className={`toc-btn${active === item.id ? ' active' : ''}`} onClick={() => scrollTo(item.id)}>
          <span className="toc-btn-num">{item.num}</span>{item.label}
        </button>
      ))}
    </nav>
  );
}

const zoomBus = { open: null };
const openZoom = (imgs, cap) => zoomBus.open && zoomBus.open({ imgs, cap });

function ZoomBtn({ imgs, cap }) {
  const { t } = useT();
  return (
    <button type="button" className="cs-zoom" aria-label={t('放大檢視：', 'Enlarge: ') + imgs[0].alt} onClick={() => openZoom(imgs, cap)}>
      <span className="cs-zoom-chip" aria-hidden="true">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
      </span>
    </button>
  );
}

function ZoomLayer() {
  const { t } = useT();
  const ref = useRef(null);
  const [z, setZ] = useState(null);
  useEffect(() => {
    zoomBus.open = v => setZ(v);
    return () => { zoomBus.open = null; };
  }, []);
  useEffect(() => {
    const d = ref.current;
    if (!d) return;
    if (z && !d.open) { d.showModal(); d.scrollTop = 0; }
    if (!z && d.open) d.close();
  }, [z]);
  return (
    <dialog ref={ref} className="cs-lb" aria-label={t('圖片放大檢視', 'Image viewer')} onClose={() => setZ(null)}
      onClick={e => { if (e.target === e.currentTarget) setZ(null); }}>
      <button type="button" className="cs-lb-close" aria-label={t('關閉', 'Close')} onClick={() => setZ(null)}>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      {z && (
        <div className="cs-lb-body">
          {z.imgs.map((im, i) => (
            <div key={i} className={'cs-lb-item' + (im.w > im.h * 1.15 ? ' wide' : '')}>
              <img src={im.src} alt={im.alt} width={im.w} height={im.h} style={{ maxWidth: im.w + 'px' }}/>
            </div>
          ))}
          {z.imgs.some(im => im.w > im.h * 1.15) && <p className="cs-lb-hint">{t('可左右滑動、雙指放大', 'Swipe sideways or pinch to zoom')}</p>}
          {z.cap && <p className="cs-lb-cap">{z.cap}</p>}
        </div>
      )}
    </dialog>
  );
}

// ══════════════════════════════
// HERO SCULPTURE — abstract constellation
// ══════════════════════════════
function SculptureCanvas() {
  const ref = useRef(null);
  useEffect(() => {
    const canvas = ref.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let W, H, raf, t0 = performance.now();
    const ACCENT = [143, 190, 220];
    const COOL = [168, 184, 200];
    const N = 96;
    const CONNECT = 64;
    const MOUSE_R = 130;

    const mouse = { x: -9999, y: -9999, ax: -9999, ay: -9999 };

    // Asymmetric organic cloud — bias toward upper-left of canvas
    // Use Fibonacci-like swirl + jitter; mix 3 concentric "veils"
    const pts = [];
    const golden = Math.PI * (3 - Math.sqrt(5));
    const veils = [
      { count: 38, radius: 0.42, jitter: 0.18, accent: 0.65 },
      { count: 32, radius: 0.28, jitter: 0.22, accent: 0.55 },
      { count: 26, radius: 0.55, jitter: 0.32, accent: 0.45 },
    ];
    let idx = 0;
    veils.forEach((v, vi) => {
      for (let i = 0; i < v.count; i++) {
        const angle = golden * idx + vi * 1.3;
        const rr = v.radius * (0.6 + Math.random() * 0.7);
        const jx = (Math.random() - 0.5) * v.jitter;
        const jy = (Math.random() - 0.5) * v.jitter;
        // bias to upper-left → subtract slightly
        pts.push({
          bx: Math.cos(angle) * rr + jx - 0.04,
          by: Math.sin(angle) * rr * 1.15 + jy - 0.02,
          x: 0, y: 0,
          phase: Math.random() * Math.PI * 2,
          driftSpeed: 0.18 + Math.random() * 0.32,
          breathSpeed: 0.6 + Math.random() * 0.7,
          size: 0.7 + Math.random() * 1.4,
          accent: Math.random() < v.accent,
          dispX: 0, dispY: 0,
        });
        idx++;
      }
    });

    const resize = () => {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const rect = canvas.getBoundingClientRect();
      W = rect.width;
      H = rect.height;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };

    const onMove = e => {
      const rect = canvas.getBoundingClientRect();
      mouse.x = e.clientX - rect.left;
      mouse.y = e.clientY - rect.top;
    };
    const onLeave = () => { mouse.x = -9999; mouse.y = -9999; };

    const draw = () => {
      const t = (performance.now() - t0) / 1000;
      ctx.clearRect(0, 0, W, H);

      // smooth mouse for delayed organic feel
      if (mouse.x > -1000) {
        if (mouse.ax < -1000) { mouse.ax = mouse.x; mouse.ay = mouse.y; }
        else {
          mouse.ax += (mouse.x - mouse.ax) * 0.06;
          mouse.ay += (mouse.y - mouse.ay) * 0.06;
        }
      }

      // global breathing 0.85-1.0
      const breath = 0.85 + 0.15 * Math.sin(t * 0.32);

      const cx = W * 0.5, cy = H * 0.5;
      const R = Math.min(W, H) * 0.42;

      // compute screen positions with drift + ripple
      const screen = pts.map(p => {
        // gentle orbital drift around base
        const wob = t * p.driftSpeed * 0.45 + p.phase;
        const driftX = Math.sin(wob) * 0.012;
        const driftY = Math.cos(wob * 0.9) * 0.012;
        const sx = cx + (p.bx + driftX) * R;
        const sy = cy + (p.by + driftY) * R;

        // mouse ripple — push gently away, smooth restore
        let ttx = sx, tty = sy;
        if (mouse.ax > -1000) {
          const dx = sx - mouse.ax, dy = sy - mouse.ay;
          const d = Math.sqrt(dx * dx + dy * dy);
          if (d < MOUSE_R && d > 0) {
            const force = (1 - d / MOUSE_R) * 14;
            p.dispX += (dx / d) * force * 0.05;
            p.dispY += (dy / d) * force * 0.05;
          }
        }
        p.dispX *= 0.92;
        p.dispY *= 0.92;
        ttx = sx + p.dispX;
        tty = sy + p.dispY;

        return { p, sx: ttx, sy: tty };
      });

      // connections — only nearby pairs, very faint, brighter near mouse
      ctx.lineCap = 'round';
      for (let i = 0; i < screen.length; i++) {
        const a = screen[i];
        for (let j = i + 1; j < screen.length; j++) {
          const b = screen[j];
          const dx = a.sx - b.sx, dy = a.sy - b.sy;
          const d = Math.sqrt(dx * dx + dy * dy);
          if (d > CONNECT) continue;
          let alpha = (1 - d / CONNECT) * 0.16 * breath;
          if (mouse.ax > -1000) {
            const mdx = (a.sx + b.sx) / 2 - mouse.ax;
            const mdy = (a.sy + b.sy) / 2 - mouse.ay;
            const md = Math.sqrt(mdx * mdx + mdy * mdy);
            if (md < MOUSE_R) alpha += (1 - md / MOUSE_R) * 0.32;
          }
          ctx.beginPath();
          ctx.moveTo(a.sx, a.sy);
          ctx.lineTo(b.sx, b.sy);
          ctx.strokeStyle = `rgba(${ACCENT[0]},${ACCENT[1]},${ACCENT[2]},${Math.min(alpha, 0.6)})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }

      // particles — soft blue-gray with individual breath
      screen.forEach(({ p, sx, sy }) => {
        const b2 = 0.55 + 0.45 * Math.sin(t * p.breathSpeed + p.phase);
        let alpha = 0.25 + b2 * 0.4;
        let r = p.size + b2 * 0.4;
        if (mouse.ax > -1000) {
          const dx = sx - mouse.ax, dy = sy - mouse.ay;
          const d = Math.sqrt(dx * dx + dy * dy);
          if (d < MOUSE_R) {
            const k = 1 - d / MOUSE_R;
            alpha += k * 0.35;
            r += k * 0.9;
          }
        }
        const c = p.accent ? ACCENT : COOL;
        // soft glow halo
        const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, r * 4);
        g.addColorStop(0, `rgba(${c[0]},${c[1]},${c[2]},${Math.min(alpha, 0.85) * 0.45})`);
        g.addColorStop(1, 'transparent');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(sx, sy, r * 4, 0, Math.PI * 2);
        ctx.fill();
        // core
        ctx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},${Math.min(alpha, 0.9)})`;
        ctx.beginPath();
        ctx.arc(sx, sy, r, 0, Math.PI * 2);
        ctx.fill();
      });

      raf = requestAnimationFrame(draw);
    };

    resize();
    draw();
    window.addEventListener('resize', resize);
    canvas.parentElement.addEventListener('mousemove', onMove);
    canvas.parentElement.addEventListener('mouseleave', onLeave);

    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener('resize', resize);
      canvas.parentElement?.removeEventListener('mousemove', onMove);
      canvas.parentElement?.removeEventListener('mouseleave', onLeave);
    };
  }, []);
  return <canvas ref={ref} className="sculpture-canvas"/>;
}

// HOME PAGE
// ══════════════════════════════
// ══════════════════════════════
// GLOW ORB — irregular light through fog (peach + mist blue)
// ══════════════════════════════
// shared with HeroTitle: hovering a title line changes how the glow behaves
const ORB_STATE = { mode: 'idle' };
const GLOW_E = 1.6; // canvas is this much larger than its column (see .glow-canvas)
function GlowOrb() {
  const ref = useRef(null);
  useEffect(() => {
    const canvas = ref.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const PEACH = [242, 201, 176], BLUE = [143, 190, 220], ROSE = [236, 186, 172], CREAM = [255, 247, 238], SKY = [178, 212, 232];
    // several soft lights drifting at different speeds → one slowly morphing, irregular glow
    const blobs = [
      { c: PEACH, r: 0.34, ax: 0.10, ay: 0.08, fx: 0.13, fy: 0.17, ph: 0.0, a: 0.85 },
      { c: BLUE,  r: 0.32, ax: 0.11, ay: 0.09, fx: 0.10, fy: 0.08, ph: 2.1, a: 0.75 },
      { c: ROSE,  r: 0.24, ax: 0.13, ay: 0.11, fx: 0.16, fy: 0.12, ph: 4.0, a: 0.55 },
      { c: SKY,   r: 0.22, ax: 0.14, ay: 0.10, fx: 0.07, fy: 0.18, ph: 1.2, a: 0.6 },
      { c: CREAM, r: 0.17, ax: 0.06, ay: 0.06, fx: 0.20, fy: 0.14, ph: 3.3, a: 0.95 },
    ];
    let W, H, raf, BW, BH, OX, OY; // BW/BH/OX/OY = the original column box inside the larger canvas
    const t0 = performance.now();
    const m = { x: 0.5, y: 0.5, on: 0, act: 0 }, sm = { x: 0.5, y: 0.5, on: 0 };
    // amp = how far the lights wander, rad = their size, ring = outline shown in design mode,
    // kick = click pulse, px/py = offset of the whole glow toward the cursor
    const fx = { amp: 1, rad: 1, ring: 0, kick: 0, px: 0, py: 0 };
    const ripples = [];
    const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

    const resize = () => {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const rect = canvas.getBoundingClientRect();
      W = rect.width; H = rect.height;
      BW = W / GLOW_E; BH = H / GLOW_E; OX = (W - BW) / 2; OY = (H - BH) / 2;
      canvas.width = W * dpr; canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };

    const draw = () => {
      const t = reduce ? 6 : (performance.now() - t0) / 1000;
      const dark = document.documentElement.getAttribute('data-theme') === 'dark';
      ctx.clearRect(0, 0, W, H);
      // 始於 line → curiosity: the light spreads and wanders; 成於 line → design: it gathers into a clear shape
      const mode = ORB_STATE.mode;
      const tg = mode === 'curious' ? [2.1, 1.18, 0] : mode === 'design' ? [0.15, 0.62, 1] : [1, 1, 0];
      const ez = reduce ? 1 : 0.045;
      fx.amp += (tg[0] - fx.amp) * ez; fx.rad += (tg[1] - fx.rad) * ez; fx.ring += (tg[2] - fx.ring) * ez;
      fx.kick *= 0.93;
      sm.x += (m.x - sm.x) * 0.04; sm.y += (m.y - sm.y) * 0.04; sm.on += (m.on - sm.on) * 0.05;
      const S = Math.min(BW, BH);
      // the glow leans toward the cursor: gently from anywhere in the hero, strongly when it's close
      const pull = m.act ? (m.on ? 0.4 : 0.14) * (mode === 'design' ? 0.35 : 1) : 0;
      const lim = S * 0.32;
      const tx = Math.max(-lim, Math.min(lim, (m.x - 0.52) * BW * pull));
      const ty = Math.max(-lim, Math.min(lim, (m.y - 0.5) * BH * pull));
      fx.px += (tx - fx.px) * 0.05; fx.py += (ty - fx.py) * 0.05;
      const cx = OX + BW * 0.52 + fx.px;
      const cy = OY + BH * 0.5 + fx.py;
      ctx.globalCompositeOperation = dark ? 'screen' : 'source-over';
      const k = dark ? 0.55 : 1;
      blobs.forEach(b => {
        const x = cx + S * b.ax * fx.amp * Math.sin(t * b.fx + b.ph);
        const y = cy + S * b.ay * fx.amp * Math.cos(t * b.fy + b.ph * 1.3);
        const r = S * b.r * fx.rad * (1 + 0.14 * Math.sin(t * b.fy * 1.4 + b.ph)) * (1 + fx.kick * 0.22);
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, rgba(b.c, b.a * k));
        g.addColorStop(0.45, rgba(b.c, b.a * 0.42 * k));
        g.addColorStop(1, rgba(b.c, 0));
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      });
      // hover: a warm light gathers where the cursor is
      if (sm.on > 0.01) {
        const mx = OX + sm.x * BW, my = OY + sm.y * BH, mr = S * 0.16;
        const g = ctx.createRadialGradient(mx, my, 0, mx, my, mr);
        g.addColorStop(0, rgba(CREAM, 0.55 * sm.on * k));
        g.addColorStop(1, rgba(CREAM, 0));
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI * 2); ctx.fill();
      }
      // design mode: a fine outline appears around the gathered light
      ctx.globalCompositeOperation = 'source-over';
      const line = a => dark ? `rgba(184,214,236,${0.55 * a})` : `rgba(36,91,132,${0.4 * a})`;
      if (fx.ring > 0.01) {
        ctx.strokeStyle = line(fx.ring);
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(cx, cy, S * 0.26 * (0.88 + 0.12 * fx.ring), 0, Math.PI * 2); ctx.stroke();
      }
      // click ripples
      const now = performance.now();
      for (let i = ripples.length - 1; i >= 0; i--) {
        const rp = ripples[i], p = (now - rp.t) / 1400;
        if (p >= 1) { ripples.splice(i, 1); continue; }
        const e = 1 - Math.pow(1 - p, 3);
        ctx.strokeStyle = line(1 - p);
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(rp.x, rp.y, S * 0.42 * e, 0, Math.PI * 2); ctx.stroke();
        if (p > 0.12) {
          const e2 = 1 - Math.pow(1 - (p - 0.12) / 0.88, 3);
          ctx.strokeStyle = line((1 - p) * 0.5);
          ctx.beginPath(); ctx.arc(rp.x, rp.y, S * 0.3 * e2, 0, Math.PI * 2); ctx.stroke();
        }
      }
      raf = requestAnimationFrame(draw);
    };

    const host = canvas.closest('.hero') || canvas.parentElement;
    // the column box (not the enlarged canvas) in viewport coordinates
    const box = () => {
      const r = canvas.getBoundingClientRect();
      const w = r.width / GLOW_E, h = r.height / GLOW_E;
      return { l: r.left + (r.width - w) / 2, t: r.top + (r.height - h) / 2, w, h, r };
    };
    const onMove = e => {
      const b = box();
      const x = (e.clientX - b.l) / b.w, y = (e.clientY - b.t) / b.h;
      const inside = x >= 0 && x <= 1 && y >= 0 && y <= 1;
      m.x = x; m.y = y;
      m.act = reduce ? 0 : 1;
      m.on = reduce || !inside ? 0 : 1;
    };
    const onLeave = () => { m.x = 0.5; m.y = 0.5; m.on = 0; m.act = 0; };
    // click on the glow side: a ripple spreads and the light jumps toward it
    const onDown = e => {
      if (reduce || e.target.closest('a,button,input,textarea,select')) return;
      const b = box();
      if (e.clientX < b.l || e.clientX > b.l + b.w || e.clientY < b.t || e.clientY > b.t + b.h) return;
      const x = e.clientX - b.r.left, y = e.clientY - b.r.top; // canvas pixels
      ripples.push({ x, y, t: performance.now() });
      if (ripples.length > 4) ripples.shift();
      fx.kick = 1;
      fx.px += (x - OX - BW * 0.52 - fx.px) * 0.35;
      fx.py += (y - OY - BH * 0.5 - fx.py) * 0.35;
    };

    resize();
    draw();
    window.addEventListener('resize', resize);
    host.addEventListener('pointermove', onMove);
    host.addEventListener('pointerleave', onLeave);
    host.addEventListener('pointerdown', onDown);
    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener('resize', resize);
      host.removeEventListener('pointermove', onMove);
      host.removeEventListener('pointerleave', onLeave);
      host.removeEventListener('pointerdown', onDown);
      ORB_STATE.mode = 'idle';
    };
  }, []);
  return <canvas ref={ref} className="sculpture-canvas glow-canvas" aria-hidden="true"/>;
}

function HeroWord({ words, index }) {
  const i = index % words.length;
  const prev = useRef(i);
  const [out, setOut] = useState(null);
  useEffect(() => {
    if (prev.current === i) return;
    setOut(prev.current);
    prev.current = i;
    const t = setTimeout(() => setOut(null), 700);
    return () => clearTimeout(t);
  }, [i]);
  return (
    <span className="hx-word">
      {words.map((w, k) => (
        <span key={k} className={'hx-w' + (k === i ? ' is-on' : k === out ? ' is-out' : '')}>{w}</span>
      ))}
    </span>
  );
}

function HeroTitle({ lang }) {
  const copy = HERO_COPY[lang] || HERO_COPY.zh;
  const slots = copy.lines.filter(l => l.words).length;
  const [n, setN] = useState(0);
  useEffect(() => {
    const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
    let id = null;
    const start = () => {
      clearInterval(id); id = null;
      if (mq.matches) { setN(0); return; }
      id = setInterval(() => setN(v => v + 1), HERO_TICK);
    };
    start();
    mq.addEventListener && mq.addEventListener('change', start);
    return () => { clearInterval(id); mq.removeEventListener && mq.removeEventListener('change', start); };
  }, []);
  let s = -1;
  return (
    <h1 className={`hero-h1 hero-title hero-title--${lang}`}>
      <span className="hx-sr">{copy.sr}</span>
      {copy.lines.map((l, li) => {
        if (l.words) s++;
        const idx = l.words ? Math.floor((n + (slots - 1 - s)) / slots) : 0;
        return (
          <span key={li} className="hx-line" aria-hidden="true"
            onPointerEnter={() => { ORB_STATE.mode = li === 0 ? 'curious' : 'design'; }}
            onPointerLeave={() => { ORB_STATE.mode = 'idle'; }}>
            <span className="hx-fixed">{l.fixed}</span>
            {l.words && <HeroWord words={l.words} index={idx}/>}

// COUNT-UP NUMBER (About stats)
// ══════════════════════════════
function CountUp({ to, prefix = '', suffix = '', delay = 0, duration = 1600, symbol = null }) {
  const elRef = React.useRef(null);
  const reduce = typeof window !== 'undefined' && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const [val, setVal] = React.useState(reduce ? to : 0);
  const [shown, setShown] = React.useState(reduce);
  React.useEffect(() => {
    if (reduce) return;
    const el = elRef.current;
    if (!el) return;
    let raf = 0, timer = 0, started = false;
    const ease = t => (t === 1 ? 1 : 1 - Math.pow(2, -10 * t)); // easeOutExpo
    const run = () => {
      started = true;
      timer = setTimeout(() => {
        setShown(true);
        if (symbol) return;
        const t0 = performance.now();
        const step = now => {
          const p = Math.min(1, (now - t0) / duration);
          setVal(Math.round(to * ease(p)));
          if (p < 1) raf = requestAnimationFrame(step);
        };
        raf = requestAnimationFrame(step);
      }, delay);
    };
    const io = new IntersectionObserver(entries => {
      if (!started && entries.some(e => e.isIntersecting)) { run(); io.disconnect(); }
    }, { threshold: 0.4 });
    io.observe(el);
    return () => { io.disconnect(); clearTimeout(timer); cancelAnimationFrame(raf); };
  }, []);
  const finalText = symbol || `${prefix}${to}${suffix}`;
  return (
    <div ref={elRef} className="av4-stat-num" aria-label={finalText}
      style={{ fontVariantNumeric: 'lining-nums tabular-nums', fontFeatureSettings: '"lnum" 1', transition: 'opacity .6s ease, transform .8s cubic-bezier(.2,.7,.2,1), filter .8s ease',
        opacity: shown ? 1 : 0, transform: shown ? 'none' : 'translateY(10px)', filter: shown ? 'none' : 'blur(4px)' }}>
      <span aria-hidden="true">{symbol || `${prefix}${val}${suffix}`}</span>
    </div>
  );
}

const xpMonths = (s, e) => {
  const [sy, sm] = s.split('.').map(Number);
  let ey, em;
  if (e === '現在') { const d = new Date(); ey = d.getFullYear(); em = d.getMonth() + 1; }
  else [ey, em] = e.split('.').map(Number);
  return (ey - sy) * 12 + (em - sm) + 1;
};
const xpDur = (s, e, lang) => {
  const m = xpMonths(s, e), y = Math.floor(m / 12), r = m % 12;
  if (lang === 'en') return [y ? `${y} yr${y > 1 ? 's' : ''}` : '', r ? `${r} mo${r > 1 ? 's' : ''}` : ''].filter(Boolean).join(' ');
  if (lang === 'ja') return y ? `${y}年${r ? `${r}か月` : ''}` : `${r}か月`;
  return y ? `${y} 年${r ? ` ${r} 個月` : ''}` : `${r} 個月`;
};

function ExperienceTimeline({ mainRef }) {
  const { lang, t } = useT();
  const exp = lang === 'en' ? EXP_EN : lang === 'ja' ? EXP_JA : EXP;
  const wrapRef = useRef(null);
  const rowRefs = useRef([]);
  const dateRefs = useRef([]);
  const litRef = useRef(null);
  const headRef = useRef(null);
  const activeRef = useRef(-2);
  const [geo, setGeo] = useState({ W: 0, H: 0, d: '', pts: [] });
  const [active, setActive] = useState(-1);
  const [open, setOpen] = useState({});

  // Build the flow line through each chapter's node (node sits exactly on the curve)
  useEffect(() => {
    const wrap = wrapRef.current;
    if (!wrap) return;
    const build = () => {
      const wr = wrap.getBoundingClientRect();
      const W = wrap.clientWidth, H = wrap.offsetHeight;
      const mob = window.innerWidth < 768;
      const cx = mob ? 8 : W / 2;
      // Desktop: the line swings wide — its turning point sits just outside each date,
      // sweeping behind the cards in between (one big, smooth S).
      const pts = EXP.map((_, i) => {
        const row = rowRefs.current[i], date = dateRefs.current[i];
        if (!row) return null;
        if (mob || !date) return { x: cx, y: row.getBoundingClientRect().top - wr.top + 30 };
        const dr = date.getBoundingClientRect();
        const y = dr.top - wr.top + 40;
        const x = i % 2 === 0
          ? Math.min(W - 12, dr.right - wr.left + 44)
          : Math.max(12, dr.left - wr.left - 44);
        return { x, y };
      }).filter(Boolean);
      const x0 = pts.length ? pts[0].x : cx;
      let d = `M ${x0} 0`, px = x0, py = 0;
      const endX = mob ? cx : (pts.length % 2 === 1 ? W * 0.3 : W * 0.7);
      [...pts, { x: endX, y: H }].forEach(p => {
        const dy = p.y - py;
        // vertical tangents at every turning point → a continuous, wave-like curve
        d += ` C ${px} ${py + dy * 0.55}, ${p.x} ${p.y - dy * 0.55}, ${p.x} ${p.y}`;
        px = p.x; py = p.y;
      });
      setGeo({ W, H, d, pts });
    };
    build();
    const ro = new ResizeObserver(build);
    ro.observe(wrap);
    window.addEventListener('resize', build);
    const t = setTimeout(build, 650); // after page-in animation settles
    return () => { ro.disconnect(); window.removeEventListener('resize', build); clearTimeout(t); };
  }, []);

  // Light the line up to the reading position; light nodes & cards it has passed
  useEffect(() => {
    const path = litRef.current, wrap = wrapRef.current;
    if (!path || !wrap || !geo.d) return;
    const L = path.getTotalLength();
    const s = [];
    for (let l = 0; l < L; l += 6) { const p = path.getPointAtLength(l); s.push([l, p.x, p.y]); }
    const pe = path.getPointAtLength(L); s.push([L, pe.x, pe.y]);
    path.style.strokeDasharray = `${L} ${L}`;
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let raf = 0, anim = 0, cur = null, target = 0;
    // length along the path at which each node sits
    const lenAtY = y => {
      let lo = 0, hi = s.length - 1;
      while (lo < hi) { const m = (lo + hi) >> 1; if (s[m][2] < y) lo = m + 1; else hi = m; }
      if (lo === 0) return 0;
      const a = s[lo - 1], b = s[lo];
      const k = b[2] === a[2] ? 0 : (y - a[2]) / (b[2] - a[2]);
      return a[0] + (b[0] - a[0]) * Math.max(0, Math.min(1, k));
    };
    const nodeLens = geo.pts.map(p => lenAtY(p.y));
    const apply = len => {
      path.style.strokeDashoffset = String(L - len);
      const h = headRef.current;
      if (h) {
        const p = path.getPointAtLength(len);
        h.setAttribute('cx', p.x); h.setAttribute('cy', p.y);
        h.style.opacity = len > 4 && len < L - 4 ? '1' : '0';
      }
      let a = -1;
      nodeLens.forEach((nl, i) => { if (len >= nl - 2) a = i; });
      if (a !== activeRef.current) { activeRef.current = a; setActive(a); }
    };
    // ease the lit length toward the scroll target → no jumpy steps
    const tick = () => {
      anim = 0;
      cur += (target - cur) * 0.14;
      if (Math.abs(target - cur) < 0.4) cur = target;
      else anim = requestAnimationFrame(tick);
      apply(cur);
    };
    const atBottom = () => {
      const m = mainRef?.current;
      if (window.innerWidth >= 768 && m) return m.scrollTop + m.clientHeight >= m.scrollHeight - 4;
      const se = document.scrollingElement;
      return se.scrollTop + se.clientHeight >= se.scrollHeight - 4;
    };
    const update = () => {
      raf = 0;
      const r = wrap.getBoundingClientRect();
      let headY = window.innerHeight * 0.62 - r.top;
      if (reduce || atBottom()) headY = geo.H;
      headY = Math.max(0, Math.min(geo.H, headY));
      target = headY >= geo.H ? L : lenAtY(headY);
      if (cur === null || reduce) { cur = target; apply(cur); return; }
      if (!anim) anim = requestAnimationFrame(tick);
    };
    const onScroll = () => { if (!raf) raf = requestAnimationFrame(update); };
    update();
    const main = mainRef?.current;
    main?.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
    return () => {
      cancelAnimationFrame(raf);
      cancelAnimationFrame(anim);
      main?.removeEventListener('scroll', onScroll);
      window.removeEventListener('scroll', onScroll);
      window.removeEventListener('resize', onScroll);
    };
  }, [geo.d, geo.H]);

  return (
    <div className="xp" ref={wrapRef}>
      <svg className="xp-svg" width={geo.W} height={geo.H} viewBox={`0 0 ${geo.W || 1} ${geo.H || 1}`} aria-hidden="true">
        <path className="xp-track" d={geo.d}/>
        <path className="xp-lit" ref={litRef} d={geo.d}/>
        {geo.pts.map((p, i) => (
          <g key={i} className={`xp-node${i <= active ? ' on' : ''}`}>
            <circle className="xp-node-halo" cx={p.x} cy={p.y} r="13"/>
            <circle className="xp-node-core" cx={p.x} cy={p.y} r="5.5"/>
          </g>
        ))}
        <circle ref={headRef} className="xp-head" r="3.5" cx="0" cy="0" style={{ opacity: 0 }}/>
      </svg>
      <ol className="xp-rows">
        {exp.map((e, i) => {
          const side = i % 2 === 0 ? 'left' : 'right';
          const more = e.highlights.slice(2);
          const isOpen = !!open[i];
          const dur = xpDur(e.start, e.end, lang);
          const endLbl = e.end === '現在' ? t('現在', 'Present') : e.end;
          return (
            <li key={i} ref={el => { rowRefs.current[i] = el; }} className={`xp-row ${side}${i <= active ? ' on' : ''}`}>
              <div className="xp-date" ref={el => { dateRefs.current[i] = el; }}>
                <div className="xp-chap">Chapter {String(i + 1).padStart(2, '0')}</div>
                <div className="xp-range">{e.start} — {endLbl}</div>
                <div className="xp-dur">{dur}</div>
              </div>
              <article className="xp-card">
                <div className="xp-card-date">{e.start} — {endLbl} · {dur}</div>
                <div className="xp-headrow">
                  {e.logo && <span className="xp-logo"><img src={e.logo} alt="" loading="lazy"/></span>}
                  <div className="xp-headtext">
                    <h3 className="xp-role">{e.role}</h3>
                    <div className="xp-co">{e.company}</div>
                  </div>
                </div>
                <div className="xp-stats">{e.stats.map(st => <span key={st} className="xp-stat">{st}</span>)}</div>
                <ul className="xp-hl">{e.highlights.slice(0, 2).map((h, j) => <li key={j}>{h}</li>)}</ul>
                {more.length > 0 && (
                  <>
                    <div className={`xp-more${isOpen ? ' open' : ''}`} id={`xp-more-${i}`} aria-hidden={!isOpen}>

function ContactPage() {
  const { t } = useT();
  const [f, setF] = useState({ name: '', email: '', msg: '' });
  const [err, setErr] = useState({});
  const [sent, setSent] = useState(false);
  const [sending, setSending] = useState(false);
  const [failed, setFailed] = useState(false);
  const [bot, setBot] = useState('');
  const check = v => {
    const out = {};
    if (!v.name.trim()) out.name = t('請填寫姓名', 'Please enter your name');
    if (!v.email.trim()) out.email = t('請填寫 Email', 'Please enter your email');
    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email.trim())) out.email = t('Email 格式不正確', 'That email address doesn’t look right');
    if (!v.msg.trim()) out.msg = t('請填寫留言內容', 'Please enter a message');
    return out;
  };
  const upd = k => e => {
    const val = e.target.value;
    setF(x => ({ ...x, [k]: val }));
    if (err[k]) setErr(x => { const n = { ...x }; delete n[k]; return n; });
  };
  const sub = e => {
    e.preventDefault();
    const found = check(f);
    setErr(found);
    const first = ['name', 'email', 'msg'].find(k => found[k]);
    if (first) { document.getElementById('cf-' + first)?.focus(); return; }
    // Netlify Forms: post to the static "contact" form declared in the page body
    const body = new URLSearchParams({ 'form-name': 'contact', 'bot-field': bot, name: f.name.trim(), email: f.email.trim(), message: f.msg.trim() }).toString();
    setSending(true); setFailed(false);
    fetch('/', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body })
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); })
      .then(() => { setSent(true); setF({ name: '', email: '', msg: '' }); setTimeout(() => setSent(false), 4000); })
      .catch(() => setFailed(true))
      .finally(() => setSending(false));
  };
  const fieldCls = (base, k) => base + (err[k] ? ' is-err' : '');
  const errProps = k => ({ 'aria-invalid': !!err[k], 'aria-describedby': err[k] ? 'cf-' + k + '-err' : undefined });
  return (
    <div className="pg page pg-contact">
      <div className="pg-header">
        <div className="pg-meta-row">
          <span className="pg-num">04 / {t('聯絡', 'Contact')}</span>

      </div>
      <div className="contact-layout">
        <div>
          <p className="ct-status"><span className="hero-meta-dot" aria-hidden="true"></span>{t('開放工作機會', 'Available for work', 'お仕事のご相談受付中')}</p>
          <div className="ct-h">{t(<>一起創造<em>有意義</em>的作品。</>, <>Let's create something <em>meaningful</em> together.</>, <>一緒に<em>意味のある</em>ものをつくりましょう。</>)}</div>
          <p className="ct-sub">{t('通常在 24 小時內回覆。', 'I usually reply within 24 hours.')}</p>
          <div className="ct-links">
            {[{ l: 'Email', v: 'jenna030917@gmail.com', h: 'mailto:jenna030917@gmail.com' }, { l: 'LinkedIn', v: 'linkedin.com/in/leehuiju', h: 'https://www.linkedin.com/in/leehuiju' }, { l: 'Cake.me', v: 'cake.me/me/jenna030917', h: 'https://www.cake.me/me/jenna030917' }, { l: 'Based in', v: t('台灣台北', 'Taipei, Taiwan') }].map(c => (
              <div key={c.l} className="ct-link"><span className="ct-link-label">{c.l}</span>{c.h
                ? <a className="ct-link-a" href={c.h} {...(c.h.startsWith('http') ? { target: '_blank', rel: 'noopener noreferrer' } : {})}>{c.v}{c.h.startsWith('http') && <span className="ct-ext" aria-hidden="true">↗</span>}</a>
                : c.v}</div>
            ))}
          </div>
        </div>
        <form className="cform" name="contact" onSubmit={sub} noValidate>
          <p className="cf-hp" aria-hidden="true">
            <label>Leave this empty <input name="bot-field" tabIndex={-1} autoComplete="off" value={bot} onChange={e => setBot(e.target.value)}/></label>
          </p>
          <div>
            <label className="flabel" htmlFor="cf-name">Name</label>
            <input id="cf-name" className={fieldCls('finput', 'name')} value={f.name} onChange={upd('name')} placeholder={t('你的名字', 'Your name')} autoComplete="name" {...errProps('name')}/>
            {err.name && <p className="ferr" id="cf-name-err">{err.name}</p>}
          </div>
          <div>
            <label className="flabel" htmlFor="cf-email">Email</label>
            <input id="cf-email" className={fieldCls('finput', 'email')} type="email" value={f.email} onChange={upd('email')} placeholder="your@email.com" autoComplete="email" {...errProps('email')}/>
            {err.email && <p className="ferr" id="cf-email-err">{err.email}</p>}
          </div>
          <div>
            <label className="flabel" htmlFor="cf-msg">Message</label>
            <textarea id="cf-msg" className={fieldCls('ftarea', 'msg')} value={f.msg} onChange={upd('msg')} placeholder={t('想聊聊什麼？簡單描述你的專案或需求…', 'Tell me about your project…')} {...errProps('msg')}></textarea>
            {err.msg && <p className="ferr" id="cf-msg-err">{err.msg}</p>}
          </div>
          <p className="fstatus" role="status" aria-live="polite">
            {failed && <span className="ferr">{t(<>訊息沒有送出，請稍後再試，或直接寄信到 <a href="mailto:jenna030917@gmail.com">jenna030917@gmail.com</a>。</>, <>Your message didn’t go through. Please try again later, or email me at <a href="mailto:jenna030917@gmail.com">jenna030917@gmail.com</a>.</>, <>メッセージを送信できませんでした。時間をおいて再度お試しいただくか、<a href="mailto:jenna030917@gmail.com">jenna030917@gmail.com</a> まで直接メールでご連絡ください。</>)}</span>}
            {sent && <span className="fok">{t('已收到你的訊息，我會盡快回覆。', 'Got your message — I’ll get back to you soon.')}</span>}
          </p>
          <button type="submit" className={`fsub${sent ? ' sent' : ''}`} disabled={sending} aria-busy={sending}>
            {sending ? t('傳送中…', 'Sending…') : sent ? t('✓ 已送出', '✓ Message sent') : t('送出訊息', 'Send Message')}
            <svg className="fsub-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </button>
        </form>
      </div>
    </div>
  );
}

function LangMenu({ setLang, variant = 'nav' }) {
  const { lang, t } = useT();
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  const listId = 'lang-list-' + variant;
  useEffect(() => {
    if (!open) return;
    const onDown = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    const onKey = e => { if (e.key === 'Escape') { setOpen(false); ref.current?.querySelector('.lang-btn')?.focus(); } };
    document.addEventListener('pointerdown', onDown);
    document.addEventListener('keydown', onKey);
    return () => { document.removeEventListener('pointerdown', onDown); document.removeEventListener('keydown', onKey); };
  }, [open]);
  const cur = LANGS.find(l => l.id === lang) || LANGS[0];
  return (
    <div className={`lang-menu ${variant}`} ref={ref}>
      <button type="button" className={(variant === 'nav' ? 'tnav-icon' : 'mob-lang-btn') + ' lang-btn'}
        aria-haspopup="true" aria-expanded={open} aria-controls={listId}
        aria-label={t('語言：繁體中文', 'Language: English', '言語：日本語')}
        onClick={() => setOpen(o => !o)}>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9s1.3-6.4 3.8-9z"/></svg>
        {variant === 'overlay' && <span>{cur.name}</span>}
      </button>
      {open && (
        <ul className="lang-list" id={listId}>
          {LANGS.map(l => (
            <li key={l.id}>
              <button type="button" lang={l.html} className={`lang-opt${l.id === lang ? ' on' : ''}`} aria-current={l.id === lang ? 'true' : undefined}
                onClick={() => { setLang(l.id); setOpen(false); }}>

function TopNav({ active, onNav, dark, toggleDark, setLang }) {
  const { lang, t } = useT();
  const items = [
    { id: 'projects', label: t('作品', 'Work') },

    { id: 'experience', label: t('經歷', 'Experience') },
    { id: 'contact', label: t('聯絡', 'Contact') },
  ];
  // sliding indicator: measure the active link, glide between links
  const pillRef = useRef(null);
  const wasOn = useRef(false);
  const [ind, setInd] = useState({ x: 0, w: 0, on: false, animate: false });
  React.useLayoutEffect(() => {
    const find = () => pillRef.current && pillRef.current.querySelector('.tnav-btn.active');
    const btn = find();
    if (!btn) { wasOn.current = false; setInd(s => ({ ...s, on: false, animate: false })); }
    else { const animate = wasOn.current; wasOn.current = true; setInd({ x: btn.offsetLeft, w: btn.offsetWidth, on: true, animate }); }
    // only snap (no animation) when the size really changed — otherwise this ran right after every click
    // (fonts.ready resolves instantly) and switched the transition off before the slide could start
    const onResize = () => { const b = find(); if (b) setInd(s => (s.x === b.offsetLeft && s.w === b.offsetWidth) ? s : ({ ...s, x: b.offsetLeft, w: b.offsetWidth, animate: false })); };
    window.addEventListener('resize', onResize);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(onResize);
    return () => window.removeEventListener('resize', onResize);
  }, [active, lang]);
  const ease = 'cubic-bezier(0.22,1,0.36,1)';
  return (
    <header className="tnav-wrap">
      <nav className="tnav" aria-label="Main">

              : <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/></svg>

}

// ══════════════════════════════
// APP
// ══════════════════════════════
function App() {
  const [page, setPage] = useState('home');
  const [homeWork, setHomeWork] = useState(false); // home page scrolled down to its work list
  const [activeProj, setActiveProj] = useState(null);
  const [dark, setDark] = useState(false);
  // language: Chinese by default, remembered per visitor
  const [lang, setLang] = useState(() => { try { const v = localStorage.getItem('portfolio-lang'); return v === 'en' || v === 'ja' ? v : 'zh'; } catch (e) { return 'zh'; } });
  const toggleLang = () => setLang(l => (l === 'en' ? 'zh' : 'en'));
  useEffect(() => {
    document.documentElement.lang = (LANGS.find(l => l.id === lang) || LANGS[0]).html;
    document.title = lang === 'en' ? 'Jenna — Product Designer' : lang === 'ja' ? 'Jenna｜プロダクトデザイナー' : 'Jenna｜產品設計師';
    try { localStorage.setItem('portfolio-lang', lang); } catch (e) {}
  }, [lang]);
  const [menuOpen, setMenuOpen] = useState(false);
  const mainEl = useRef(null);

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  }, [dark]);

  // detect mobile to show mob menu button
  useEffect(() => {
    const update = () => {
      const isMobile = window.innerWidth < 768;
      document.querySelectorAll('[data-mob-only]').forEach(el => {
        el.style.display = isMobile ? 'flex' : 'none';
      });
    };
    update();
    window.addEventListener('resize', update);
    return () => window.removeEventListener('resize', update);
  }, []);

  const [navDir, setNavDir] = useState('down');
  const [edge, setEdge] = useState({ dir: 0, p: 0 });
  const ORDER = ['home', 'projects', 'about', 'experience', 'contact'];
  const LABELS = lang === 'en'
    ? { home: 'Home', projects: 'Work', about: 'About', experience: 'Experience', contact: 'Contact' }
    : lang === 'ja' ? { home: 'ホーム', projects: '作品', about: 'プロフィール', experience: '経歴', contact: 'お問い合わせ' }
    : { home: '首頁', projects: '作品', about: '關於', experience: '經歷', contact: '聯絡' };
  const getScroller = () => window.innerWidth < 768 ? document.scrollingElement : mainEl.current;

  // dir < 0 = arrived by scrolling up → land at the bottom of the previous page
  const navigate = (id, proj, dir = 1) => {
    setNavDir(dir < 0 ? 'up' : 'down');
    setPage(id);
    if (proj) setActiveProj(proj);
    const jump = () => {
      const s = getScroller();
      if (s) s.scrollTo({ top: dir < 0 ? s.scrollHeight : 0, behavior: 'instant' });
    };
    jump();
    if (dir < 0) requestAnimationFrame(() => requestAnimationFrame(jump));
  };

  // Keep scrolling past the bottom / top → switch to the next / previous tab
  useEffect(() => {
    // v5.6: scroll-past-the-edge page switching turned off — it read as stutter; pages end with a “next page” link instead
    const EDGE_SWITCH = false;
    if (!EDGE_SWITCH || page === 'case') return;
    const idx = ORDER.indexOf(page);
    const THRESH = 260;          // extra scroll needed past the edge
    let acc = 0, dir = 0, lock = true, resetT, lastScroll = 0;
    const unlockT = setTimeout(() => { lock = false; }, 700); // ignore inertia right after a switch
    const clear = () => { acc = 0; setEdge({ dir: 0, p: 0 }); };
    const atEdge = d => {
      const s = getScroller();
      if (!s) return false;
      return d > 0 ? s.scrollTop + s.clientHeight >= s.scrollHeight - 2 : s.scrollTop <= 2;
    };
    const push = delta => {
      if (lock || !delta) return;
      const d = delta > 0 ? 1 : -1;
      const target = idx + d;
      // must be resting at the edge (not still gliding into it)
      if (target < 0 || target >= ORDER.length || !atEdge(d) || performance.now() - lastScroll < 250) { clear(); return; }
      if (d !== dir) { acc = 0; dir = d; }
      acc += Math.min(Math.abs(delta), 80);
      const p = Math.min(acc / THRESH, 1);
      setEdge({ dir: d, p });
      clearTimeout(resetT);
      resetT = setTimeout(clear, 500);
      if (p >= 1) { lock = true; clear(); navigate(ORDER[target], null, d); }
    };
    const onScroll = () => { lastScroll = performance.now(); };
    const onWheel = e => push(e.deltaY);
    let ty = null;
    const onTS = e => { ty = e.touches[0].clientY; };
    const onTM = e => { if (ty == null) return; const y = e.touches[0].clientY; push((ty - y) * 1.6); ty = y; };
    const onTE = () => { ty = null; };
    const main = mainEl.current;
    window.addEventListener('wheel', onWheel, { passive: true });
    window.addEventListener('touchstart', onTS, { passive: true });
    window.addEventListener('touchmove', onTM, { passive: true });
    window.addEventListener('touchend', onTE);
    window.addEventListener('scroll', onScroll, { passive: true });
    main?.addEventListener('scroll', onScroll, { passive: true });
    return () => {
      clearTimeout(unlockT); clearTimeout(resetT);
      window.removeEventListener('wheel', onWheel);
      window.removeEventListener('touchstart', onTS);
      window.removeEventListener('touchmove', onTM);
      window.removeEventListener('touchend', onTE);
      window.removeEventListener('scroll', onScroll);
      main?.removeEventListener('scroll', onScroll);
      setEdge({ dir: 0, p: 0 });
    };
  }, [page]);

  // the featured list on the home page is not the Work page, so the Work tab stays off while it is on screen
  const cur = page === 'case' ? 'projects' : page;
  const edgeTarget = edge.dir ? ORDER[ORDER.indexOf(cur) + edge.dir] : null;

  return (
    <LangCtx.Provider value={lang}>
    <div className="shell">
      <FogCanvas/>
      <TopNav active={cur} onNav={navigate} dark={dark} toggleDark={() => setDark(d => !d)} setLang={setLang}/>
      <MobBar onMenuOpen={() => setMenuOpen(true)} setLang={setLang}/>
      <SideDecorations active={cur} onNav={navigate}/>
      <main className="main" ref={mainEl} data-nav-dir={navDir}>
        {page === 'home'       && <HomePage key="home" onNav={navigate} activeStep={cur} mainRef={mainEl} onSection={setHomeWork}/>}
        {page === 'projects'   && <ProjectsPage key="proj" onNav={navigate}/>}
        {page === 'about'      && <AboutPage key="about"/>}
        {page === 'experience' && <ExperiencePage key="exp" mainRef={mainEl}/>}
        {page === 'contact'    && <ContactPage key="contact"/>}
        {page === 'case' && activeProj && <CaseStudyPage key={activeProj.id} project={activeProj} onBack={() => navigate('projects')} onOpen={p => navigate('case', p)} mainRef={mainEl}/>}
        {['projects', 'about', 'experience', 'contact'].includes(page) && (() => {
          const i = ORDER.indexOf(page);
          // Work is the first page of the sequence: no "previous" (home already lists the same work)
          const prev = page === 'projects' ? null : ORDER[i - 1], next = ORDER[i + 1];
          const PN = lang === 'en' ? { prev: 'Previous', next: 'Next', nav: 'Page navigation' }
            : lang === 'ja' ? { prev: '前へ', next: '次へ', nav: 'ページ移動' }
            : { prev: '上一頁', next: '下一頁', nav: '頁面切換' };
          return (
            <nav className="next-wrap" aria-label={PN.nav}>
              <div className="pn-row">
                {prev ? (
                  <button type="button" className="next-page is-prev" onClick={() => navigate(prev)}>
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M20 12H4M10 6l-6 6 6 6"/></svg>
                    <span className="np-text">
                      <span className="next-page-label">{PN.prev}</span>
                      <span className="next-page-title">{LABELS[prev]}</span>
                    </span>
                  </button>
                ) : <span aria-hidden="true"></span>}
                {next && (
                  <button type="button" className="next-page is-next" onClick={() => navigate(next)}>
                    <span className="np-text">
                      <span className="next-page-label">{PN.next}</span>
                      <span className="next-page-title">{LABELS[next]}</span>
                    </span>
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg>
                  </button>
                )}
              </div>
            </nav>
          );
        })()}
      </main>
      {edgeTarget && (
        <div className={`edge-hint ${edge.dir > 0 ? 'down' : 'up'}`} role="status">
          <span className="edge-hint-label">{edge.dir > 0 ? 'Keep scrolling ↓' : 'Keep scrolling ↑'} <b>{LABELS[edgeTarget]}</b></span>
          <span className="edge-hint-bar"><span style={{ transform: `scaleX(${edge.p})` }}></span></span>
        </div>
      )}
      <MobileMenu open={menuOpen} onClose={() => setMenuOpen(false)} active={cur} onNav={navigate} dark={dark} toggleDark={() => setDark(d => !d)} setLang={setLang}/>
    </div>
    </LangCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
