<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Jenna. — Product Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&family=Noto+Sans+TC:wght@300;400;500;600&display=block" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Inter','Noto Sans TC','Noto Sans JP',sans-serif;
  background:var(--bg);color:var(--text);
  overflow:hidden;font-weight:400;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

/* ── TOKENS — light editorial ── */
/* ── TOKENS ── */
:root{
  --bg:#f5f4f0;
  --bg2:#eeece6;
  --bg3:#e6e4dd;
  --paper:#fafaf7;
  --text:#15181f;
  --text2:#3d434e;   /* ≥6.8:1 on every light bg incl. darkest fog */
  --text3:#525864;   /* ≥4.6:1 (AA) — was #6c7280 at 3.3:1 */
  --text4:#b4bac4;
  --bdr:rgba(20,30,50,0.09);
  --bdr2:rgba(20,30,50,0.16);
  --accent:#8FBEDC;
  --accent-text:#245b84; /* ≥4.7:1 incl. on accent-soft chips — was #3b7aa6 at 3.0:1 */
  --accent-d:#6aa8cc;
  --accent-soft:rgba(143,190,220,0.15);
  --grid-line:rgba(20,30,50,0.022);
}
[data-theme="dark"]{
  --bg:#0b0d12;
  --bg2:#13161c;
  --bg3:#1b1e26;
  --paper:#0a0c10;
  --text:#edeef4;
  --text2:#b3b9c5;
  --text3:#9ba1ae;   /* ≥5:1 on dark glass cards — was #737988 at 3.0:1 */
  --text4:#454a56;
  --bdr:rgba(255,255,255,0.09);
  --bdr2:rgba(255,255,255,0.15);
  --accent-text:#b8d6ec;
  --grid-line:rgba(255,255,255,0.022);
}

/* ── FOG CANVAS — drifting clouds & mist ── */
#fog-canvas{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  width:100vw;height:100vh;display:block;
  background:linear-gradient(180deg,#fbfaf5 0%,#e9e9e3 55%,#d5d6d0 100%);
}
[data-theme="dark"] #fog-canvas{
  background:linear-gradient(180deg,#10131a 0%,#0b0d12 60%,#07080c 100%);
}

/* ── NOISE TEXTURE ── */
.noise-bg{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  opacity:0.025;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 0.56 0 0 0 0 0.74 0 0 0 0 0.86 0 0 0 1 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:240px;
}

/* ── THIN GRID OVERLAY ── */
.grid-bg{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(var(--grid-line) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);
  background-size:140px 140px;
  mask-image:radial-gradient(ellipse 95% 85% at 50% 50%,black 25%,transparent 100%);
  opacity:0.4;
}

/* ── SHELL ── */
.shell{
  height:100dvh;width:100vw;
  display:flex;flex-direction:column;
  position:relative;z-index:1;
}

/* ══════════════════════════════
   ICON RAIL — left, hover-expand
══════════════════════════════ */
.rail{
  position:fixed;left:0;top:0;bottom:0;z-index:50;
  width:72px;background:color-mix(in srgb,var(--paper) 62%,transparent);
  -webkit-backdrop-filter:blur(20px) saturate(1.1);backdrop-filter:blur(20px) saturate(1.1);
  border-right:1px solid var(--bdr);
  display:flex;flex-direction:column;align-items:stretch;
  padding:24px 0 20px;
  transition:width 0.4s cubic-bezier(0.22,1,0.36,1);
  overflow:hidden;
}
.rail:hover{width:220px}
.rail-brand{
  display:flex;align-items:center;gap:12px;
  padding:0 24px 0 26px;margin-bottom:24px;
  width:220px;flex-shrink:0;
}
.rail-logo{
  font-family:'Cormorant Garamond',serif;
  font-size:28px;font-weight:500;
  color:var(--text);letter-spacing:-0.5px;line-height:1;
  flex-shrink:0;width:20px;
}
.rail-logo span{color:var(--accent-text)}
.rail-brand-text{
  display:flex;flex-direction:column;gap:3px;
  opacity:0;transform:translateX(-6px);
  transition:opacity 0.25s ease 0.05s,transform 0.3s ease;
  white-space:nowrap;
}
.rail:hover .rail-brand-text{opacity:1;transform:translateX(0)}
.rail-brand-name{
  font-family:'Cormorant Garamond',serif;font-size:15px;
  font-weight:500;color:var(--text);letter-spacing:-0.2px;line-height:1;
}
.rail-brand-role{
  font-family:'Inter',sans-serif;font-size:9.5px;color:var(--text3);
  letter-spacing:1.5px;text-transform:uppercase;
}
.rail-divider{
  margin:0 24px 16px;height:1px;background:var(--bdr);
  width:24px;transition:width 0.3s ease;
}
.rail:hover .rail-divider{width:172px}
.rail-label{
  font-size:10px;color:var(--text3);letter-spacing:2px;
  text-transform:uppercase;font-family:'Inter',sans-serif;
  padding:0 24px;margin-bottom:10px;
  opacity:0;transition:opacity 0.25s ease 0.05s;
  white-space:nowrap;
}
.rail:hover .rail-label{opacity:1}
.rail-nav{list-style:none;display:flex;flex-direction:column;gap:2px;flex:1;padding:0 12px}
.rail-btn{
  display:flex;align-items:center;gap:14px;width:100%;
  padding:11px 12px;border:none;background:none;cursor:pointer;
  border-radius:10px;color:var(--text2);
  font-family:'Inter',sans-serif;font-size:13px;font-weight:400;
  text-align:left;transition:background 0.22s,color 0.22s;
  position:relative;
}
.rail-btn:hover{background:var(--bg2);color:var(--text)}
.rail-btn.active{background:var(--accent-soft);color:var(--accent-text);font-weight:500}
.rail-btn.active::before{
  content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:2.5px;height:20px;border-radius:0 2px 2px 0;background:var(--accent);
}
.rail-btn-icon{flex-shrink:0;width:20px;display:flex;align-items:center;justify-content:center}
.rail-btn-label{
  white-space:nowrap;
  opacity:0;transform:translateX(-4px);
  transition:opacity 0.25s ease 0.05s,transform 0.3s ease;
}
.rail:hover .rail-btn-label{opacity:1;transform:translateX(0)}
.rail-bottom{
  margin-top:auto;padding:16px 12px 0;
  display:flex;flex-direction:column;gap:6px;
  border-top:1px solid var(--bdr);
}
.rail-action{
  display:flex;align-items:center;gap:14px;width:100%;
  padding:10px 12px;border:none;background:none;cursor:pointer;
  border-radius:10px;color:var(--text2);
  font-family:'Inter',sans-serif;font-size:13px;font-weight:400;
  text-align:left;transition:background 0.22s,color 0.22s;
  text-decoration:none;
}
.rail-action:hover{background:var(--bg2);color:var(--text)}
.rail-status{cursor:default;font-size:12px;color:var(--text2)}
.rail-status:hover{background:none;color:var(--text2)}
.rail-status-dot{
  position:relative;width:8px;height:8px;border-radius:50%;background:#6FB58E;
}
.rail-status-dot::after{
  content:'';position:absolute;inset:-4px;border-radius:50%;
  border:1px solid rgba(111,181,142,0.6);
  animation:statusPulse 2.4s ease-out infinite;
}
@keyframes statusPulse{0%{transform:scale(0.6);opacity:1}100%{transform:scale(1.6);opacity:0}}
@media (prefers-reduced-motion: reduce){.rail-status-dot::after{animation:none;opacity:0.5}}
.rail-action-icon{flex-shrink:0;width:20px;display:flex;align-items:center;justify-content:center}
.rail-action-label{
  white-space:nowrap;
  opacity:0;transform:translateX(-4px);
  transition:opacity 0.25s ease 0.05s,transform 0.3s ease;
}
.rail:hover .rail-action-label{opacity:1;transform:translateX(0)}

/* MOBILE hamburger replacement */
.mob-bar{
  display:none;position:fixed;top:0;left:0;right:0;z-index:50;
  height:56px;padding:0 20px;
  background:color-mix(in srgb,var(--paper) 62%,transparent);border-bottom:1px solid var(--bdr);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  align-items:center;justify-content:space-between;
}
.mob-brand{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:500;color:var(--text);letter-spacing:-0.3px}
.mob-brand span{color:var(--accent-text)}
.hamburger{
  width:38px;height:38px;border:1px solid var(--bdr);background:none;
  border-radius:50%;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4.5px;
  color:var(--text);
}
.hamburger span{display:block;width:15px;height:1.5px;background:currentColor;border-radius:2px;transition:all 0.3s}
.hamburger.open span:nth-child(1){transform:translateY(6px) rotate(45deg)}
.hamburger.open span:nth-child(2){opacity:0}
.hamburger.open span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}

/* ── SIDE DECORATIONS (no scroll indicator) ── */
.side-l{
  position:fixed;left:88px;top:50%;
  transform:translateY(-50%) rotate(-90deg);
  transform-origin:left center;
  font-size:10px;letter-spacing:2.5px;text-transform:uppercase;
  color:var(--text3);font-family:'Inter',sans-serif;
  z-index:10;pointer-events:none;white-space:nowrap;
}
.side-r{
  position:fixed;right:32px;top:50%;transform:translateY(-50%);
  z-index:10;display:flex;flex-direction:column;align-items:flex-end;
  gap:6px;pointer-events:none;
}
.side-r-item{
  display:flex;align-items:center;gap:10px;
  font-size:10.5px;color:var(--text3);font-family:'Inter',sans-serif;
  font-variant-numeric:tabular-nums;letter-spacing:0.5px;
  transition:color 0.3s;
}
.side-r-item.active{color:var(--text)}
.side-r-dot{
  width:5px;height:5px;border-radius:50%;
  background:var(--text4);transition:all 0.3s;
}
.side-r-item.active .side-r-dot{
  background:var(--accent);
  box-shadow:0 0 0 4px var(--accent-soft);
}

/* SCROLL indicator removed per design */
.bottom-l{display:none}
.bottom-r{
  position:fixed;right:48px;bottom:32px;z-index:10;
  display:flex;gap:28px;
}
.bottom-r a{
  font-size:11px;color:var(--text2);
  font-family:'Inter',sans-serif;text-decoration:none;
  letter-spacing:0.3px;transition:color 0.25s;
}
.bottom-r a:hover{color:var(--accent-text)}

/* ── MAIN SCROLL — offset for rail ── */
.main{
  flex:1;height:100dvh;
  margin-left:72px;
  overflow-y:auto;overflow-x:hidden;
  scroll-behavior:smooth;
  scrollbar-width:none;
  position:relative;
}
.main::-webkit-scrollbar{display:none}

/* page transition */
.page{animation:pageIn 0.6s cubic-bezier(0.22,1,0.36,1)}
@keyframes pageIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes pageInUp{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
.main[data-nav-dir="up"] .page{animation-name:pageInUp}

/* edge-scroll page switch hint */
.edge-hint{
  position:fixed;left:50%;z-index:60;pointer-events:none;
  transform:translateX(calc(-50% + 36px));
  display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:10px 20px 11px;border-radius:999px;
  background:color-mix(in srgb,var(--paper) 70%,transparent);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border:1px solid var(--bdr);
  font-family:'Inter',sans-serif;font-size:10.5px;letter-spacing:1.8px;
  text-transform:uppercase;color:var(--text2);
  animation:hintIn 0.25s ease;
}
.edge-hint.down{bottom:28px}
.edge-hint.up{top:28px}
.edge-hint-label b{color:var(--accent-text);font-weight:500}
.edge-hint-bar{width:72px;height:2px;border-radius:2px;background:var(--bdr2);overflow:hidden}
.edge-hint-bar span{display:block;height:100%;background:var(--accent);transform-origin:left;transition:transform 0.12s linear}
@keyframes hintIn{from{opacity:0}to{opacity:1}}

/* ── HERO — adjusted for rail offset ── */
.hero{
  min-height:100dvh;
  display:grid;grid-template-columns:minmax(420px,46%) 1fr;
  align-items:center;
  padding:96px 96px 96px 80px;
  position:relative;
}
.hero-left{position:relative;z-index:2}
.hero-eyebrow{
  display:flex;align-items:center;gap:9px;margin-bottom:36px;
}
.hero-eyebrow-dot{
  width:6px;height:6px;border-radius:50%;background:var(--accent);
}
.hero-eyebrow-text{
  font-size:11px;color:var(--text2);
  font-family:'Inter',sans-serif;letter-spacing:2px;text-transform:uppercase;
}
.hero-h1{
  font-family:'Cormorant Garamond','Noto Sans TC',serif;
  font-size:clamp(48px,5.8vw,84px);
  font-weight:400;line-height:1.08;letter-spacing:-1.8px;
  color:var(--text);margin-bottom:48px;
  max-width:90%;
}
.hero-h1 .hl-accent{
  color:var(--accent-text);font-style:italic;font-weight:400;
}
.hero-h1-typewriter{
  color:var(--accent-text);font-style:italic;font-weight:400;
}
.hero-cursor{
  display:inline-block;width:3px;height:0.8em;
  background:var(--accent);margin-left:4px;vertical-align:baseline;
  animation:blink 1s step-end infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

.hero-sub{
  font-size:14.5px;color:var(--text2);
  line-height:1.85;font-weight:300;
  font-family:'Noto Sans TC',sans-serif;
  max-width:340px;margin-bottom:56px;
  margin-top:0;
}
.hero-jp{
  font-family:'Noto Sans JP',sans-serif;font-weight:300;
  font-size:13px;color:var(--text3);line-height:1.85;
  margin-bottom:48px;
}
.hero-cta{
  display:inline-flex;align-items:center;gap:18px;
  background:none;border:none;cursor:pointer;
  font-family:'Inter',sans-serif;font-size:13px;
  color:var(--text);padding:0;
  transition:gap 0.3s ease;
}
.hero-cta:hover{gap:24px}
.hero-cta:hover .hero-cta-arrow{transform:translateX(4px)}
.hero-cta-dot{
  width:48px;height:48px;border-radius:50%;
  border:1px solid var(--bdr2);
  display:flex;align-items:center;justify-content:center;
  transition:border-color 0.3s,background 0.3s;
}
.hero-cta-dot-inner{
  width:8px;height:8px;border-radius:50%;background:var(--accent);
}
.hero-cta:hover .hero-cta-dot{border-color:var(--accent);background:var(--accent-soft)}
.hero-cta-arrow{transition:transform 0.3s ease;color:var(--text)}

.hero-right{
  position:relative;height:100%;min-height:600px;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.sculpture-canvas{
  position:absolute;inset:0;width:100%;height:100%;
  pointer-events:none;
}
/* glow canvas bleeds past its column so the light is never cut by a hard edge */
.hero-right:has(.glow-canvas){overflow:visible}
.glow-canvas{
  inset:-30%;width:160%;height:160%;
  -webkit-mask-image:radial-gradient(closest-side,#000 62%,transparent 100%);
  mask-image:radial-gradient(closest-side,#000 62%,transparent 100%);
}
/* hero lines talk to the glow: hovering one line dims the other */
.hero-title .hx-line{transition:opacity 0.5s cubic-bezier(0.22,1,0.36,1)}
.hero-title:hover .hx-line:not(:hover){opacity:0.4}
@media (hover:none){.hero-title:hover .hx-line:not(:hover){opacity:1}}

/* ══════════════════════════════
   PAGE LAYOUT
══════════════════════════════ */
.pg{padding:96px 96px 96px 80px;max-width:1480px;margin:0 auto;width:100%}
.pg-header{
  margin-bottom:72px;padding-bottom:32px;
  border-bottom:1px solid var(--bdr);
  display:flex;flex-direction:column;gap:0;
}
.pg-meta-row{
  display:flex;align-items:baseline;gap:18px;margin-bottom:18px;
}
.pg-num{
  font-family:'Inter',sans-serif;font-size:11px;color:var(--text2);
  letter-spacing:2px;
}
.pg-num-divider{
  width:32px;height:1px;background:var(--text4);
  display:inline-block;align-self:center;
}
.pg-jp{
  font-family:'Noto Sans JP',sans-serif;font-size:11.5px;color:var(--text3);
  letter-spacing:1px;
}
.pg-h1{
  font-family:'Cormorant Garamond','Noto Sans TC',serif;
  font-size:clamp(40px,4.8vw,58px);font-weight:400;
  color:var(--text);letter-spacing:-1.4px;line-height:1.02;
  margin-bottom:0;
}
.pg-h1 em{color:var(--accent-text);font-style:italic;font-weight:400}
.pg-sub{
  font-size:13.5px;color:var(--text2);
  max-width:520px;line-height:1.85;font-weight:300;
  font-family:'Noto Sans TC',sans-serif;
  margin-top:20px;text-align:left;justify-self:start;
}

/* ══════════════════════════════
   PROJECTS GRID — editorial
══════════════════════════════ */
.proj-list{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--bdr)}
.pg-header:has(+ .proj-list){margin-bottom:24px}
.pg-header + .proj-list{border-top:0}
.pi{
  display:grid;grid-template-columns:56px minmax(0,1.15fr) minmax(0,1fr) 140px;
  gap:40px;padding:36px 8px;
  border-bottom:1px solid var(--bdr);
  cursor:pointer;align-items:center;
  transition:background 0.3s,padding-left 0.3s;
  position:relative;
}
.pi::before{
  content:'';position:absolute;left:0;top:0;height:100%;width:0;
  background:linear-gradient(90deg,var(--accent-soft),transparent);
  transition:width 0.45s cubic-bezier(0.22,1,0.36,1);
}
.pi:hover{padding-left:24px}
.pi:hover::before{width:100%}
.pi-num{
  font-family:'Inter',sans-serif;font-size:11px;color:var(--text3);
  letter-spacing:1.5px;font-variant-numeric:tabular-nums;
  position:relative;z-index:1;
}
.pi-title{
  font-family:'Cormorant Garamond',serif;font-size:26px;
  font-weight:500;color:var(--text);letter-spacing:-0.5px;
  line-height:1.2;position:relative;z-index:1;
}
.pi-title-tw{
  display:block;font-family:'Noto Sans TC',sans-serif;font-size:13px;
  color:var(--text2);font-weight:300;margin-top:6px;letter-spacing:0;
}
.pi-summary{
  font-size:13px;color:var(--text2);line-height:1.7;
  font-family:'Noto Sans TC',sans-serif;font-weight:300;
  position:relative;z-index:1;
}
.pi-meta{
  display:flex;flex-direction:column;align-items:flex-end;gap:8px;
  position:relative;z-index:1;
}
.pi-year{font-size:11px;color:var(--text3);font-family:'Inter',sans-serif}
.pi-arrow{
  width:34px;height:34px;border-radius:50%;
  border:1px solid var(--bdr2);
  display:flex;align-items:center;justify-content:center;
  color:var(--text);transition:all 0.3s;
}
.pi:hover .pi-arrow{
  background:var(--accent);color:var(--paper);border-color:var(--accent);
  transform:rotate(-45deg);
}

/* selected work on home */
.work-section{padding:0 96px 96px 80px;max-width:1480px;margin:0 auto;width:100%}
.ws-head{
  display:flex;align-items:flex-end;justify-content:space-between;
  padding-bottom:36px;
}
.ws-titlebox{display:flex;align-items:baseline;gap:24px}
.ws-num{font-size:11px;color:var(--text3);letter-spacing:2px;font-family:'Inter',sans-serif}
.ws-title{
  font-family:'Cormorant Garamond',serif;font-size:48px;
  font-weight:400;color:var(--text);letter-spacing:-1px;line-height:1;
}
.ws-title em{color:var(--accent-text);font-style:italic}

.zigzag{
  position:relative;padding:40px 8% 64px;min-height:280px;
}
.zigzag-line{
  position:absolute;left:0;right:0;top:50%;height:1px;
  background:linear-gradient(90deg,transparent 0%,var(--bdr2) 12%,var(--bdr2) 88%,transparent 100%);
}
.zigzag-track{
  position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:0;
  align-items:center;height:200px;
}
.zz-step{
  position:relative;display:flex;flex-direction:column;align-items:center;
  text-align:center;height:100%;justify-content:center;
}
.zz-step.top{justify-content:flex-start}
.zz-step.bottom{justify-content:flex-end}
.zz-step-content{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  position:relative;padding:14px 8px;
}
.zz-dot{
  position:absolute;left:50%;width:9px;height:9px;border-radius:50%;
  background:var(--bg);border:1px solid var(--accent);
  box-shadow:0 0 0 4px rgba(143,190,220,0.1);
  transform:translateX(-50%);
}
.zz-step.top .zz-dot{bottom:-32px}
.zz-step.bottom .zz-dot{top:-32px}
.zz-step.last .zz-dot{background:var(--accent);box-shadow:0 0 0 5px rgba(143,190,220,0.18)}
.zz-desc-cn{
  font-family:'Noto Sans TC',sans-serif;font-size:12.5px;color:var(--text2);
  font-weight:300;line-height:1.7;
}
.zz-desc-en{
  font-family:'Inter',sans-serif;font-size:10px;color:var(--text3);
  letter-spacing:2.5px;text-transform:uppercase;
}
.zz-title{
  font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:400;
  color:var(--text);letter-spacing:-0.5px;line-height:1.2;margin-top:4px;
}
/* Walker spotlight: steps dim until the runner passes through their column */
.zigzag[data-live] .zz-desc-cn,
.zigzag[data-live] .zz-desc-en,
.zigzag[data-live] .zz-title{
  opacity:.32;transition:opacity .6s ease,color .6s ease,text-shadow .6s ease;
}
.zigzag[data-live] .zz-dot,
.zigzag[data-live] .zz-step.last .zz-dot{
  background:var(--bg);opacity:.45;box-shadow:0 0 0 4px rgba(143,190,220,0);
  transition:opacity .6s ease,background .6s ease,box-shadow .6s ease;
}
.zigzag[data-live] .zz-step[data-lit] .zz-desc-cn,
.zigzag[data-live] .zz-step[data-lit] .zz-desc-en,
.zigzag[data-live] .zz-step[data-lit] .zz-title{opacity:1}
.zigzag[data-live] .zz-step[data-lit] .zz-desc-cn{color:var(--text)}
.zigzag[data-live] .zz-step[data-lit] .zz-desc-en{color:var(--accent-text)}
.zigzag[data-live] .zz-step[data-lit] .zz-title{text-shadow:0 0 18px rgba(143,190,220,.45)}
.zigzag[data-live] .zz-step[data-lit] .zz-dot{
  opacity:1;background:var(--accent);
  box-shadow:0 0 0 5px rgba(143,190,220,.2),0 0 16px 2px rgba(143,190,220,.55);
}
.zz-walker{
  position:absolute;left:0;top:calc(50% - 26px);width:22px;height:28px;
  color:var(--text);z-index:2;pointer-events:none;
  animation:zz-run-across 11s linear infinite;
}
.zz-walker svg{display:block;overflow:visible;animation:zz-bob .32s ease-in-out infinite}
.zz-walker .zz-limb{transform-box:view-box}
.zz-walker .zz-thigh{transform-origin:11px 16px;animation:zz-thigh .64s linear infinite}
.zz-walker .zz-shin{transform-origin:11px 21px;animation:zz-shin .64s linear infinite}
.zz-walker .zz-uarm{transform-origin:12px 9.5px;animation:zz-uarm .64s ease-in-out infinite}
.zz-walker .zz-farm{transform-origin:12px 13px;animation:zz-farm .64s ease-in-out infinite}
.zz-walker .zz-b{animation-delay:-.32s}
@keyframes zz-run-across{
  0%{left:-30px;opacity:0}
  8%{opacity:1}
  92%{opacity:1}
  100%{left:calc(100% + 8px);opacity:0}
}
@keyframes zz-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}
@keyframes zz-thigh{0%,100%{transform:rotate(-38deg)}50%{transform:rotate(32deg)}}
@keyframes zz-shin{0%,100%{transform:rotate(12deg)}50%{transform:rotate(18deg)}75%{transform:rotate(85deg)}}
@keyframes zz-uarm{0%,100%{transform:rotate(40deg)}50%{transform:rotate(-45deg)}}
@keyframes zz-farm{0%,100%{transform:rotate(-55deg)}50%{transform:rotate(-95deg)}}
@media (prefers-reduced-motion: reduce){
  .zz-walker,.zz-walker svg,.zz-walker .zz-limb{animation:none}
  .zz-walker{left:auto;right:-4%}
}

/* ══════════════════════════════
   EXPERIENCE — editorial timeline
══════════════════════════════ */
.exp-v2{position:relative;padding:48px 0 120px;min-height:1200px}
.exp-flow{
  position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);
  width:520px;height:100%;z-index:0;pointer-events:none;
  overflow:visible;
}
.exp-flow-line{
  fill:none;stroke:url(#flowGrad);stroke-width:1;
  vector-effect:non-scaling-stroke;
}
.exp-flow-glow{
  fill:none;stroke:#8FBEDC;stroke-width:1.4;
  stroke-linecap:round;
  stroke-dasharray:24 380;
  filter:drop-shadow(0 0 4px rgba(143,190,220,0.6));
  animation:flowPulse 9s linear infinite;
}
.exp-flow-glow-2{
  fill:none;stroke:#8FBEDC;stroke-width:1;
  stroke-linecap:round;
  stroke-dasharray:12 600;
  filter:drop-shadow(0 0 3px rgba(143,190,220,0.4));
  animation:flowPulse 14s linear infinite 3s;
  opacity:0.7;
}
@keyframes flowPulse{
  from{stroke-dashoffset:0}
  to{stroke-dashoffset:-1200}
}
.exp-chapters{position:relative;z-index:1;display:flex;flex-direction:column;gap:160px}
.exp-chapter{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:0;min-height:240px;align-items:center}

}
.exp-chap-content{

/* ── EXPERIENCE v2 — lit flow line + alternating cards ── */
.xp{position:relative;padding:24px 0 96px}
.xp-svg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:0}
.xp-track{fill:none;stroke:var(--bdr2);stroke-width:1.4;stroke-linecap:round}
.xp-lit{fill:none;stroke:#8FBEDC;stroke-width:2.4;stroke-linecap:round;filter:drop-shadow(0 0 6px rgba(143,190,220,0.6))}
.xp-node-halo{fill:rgba(143,190,220,0);transition:fill 0.5s}
.xp-node.on .xp-node-halo{fill:rgba(143,190,220,0.2)}
.xp-node-core{fill:var(--bg);stroke:var(--text4);stroke-width:1.2;transition:fill 0.5s,stroke 0.5s}
.xp-node.on .xp-node-core{fill:#8FBEDC;stroke:#8FBEDC}
.xp-head{fill:#fff;stroke:#8FBEDC;stroke-width:1.5;filter:drop-shadow(0 0 6px rgba(143,190,220,0.9));transition:opacity 0.3s}
.xp-rows{list-style:none;display:flex;flex-direction:column;gap:88px;position:relative;z-index:1}
.xp-row{display:grid;grid-template-columns:1fr 150px 1fr;align-items:start}
.xp-row.left .xp-card{grid-column:1;grid-row:1;justify-self:end}
.xp-row.left .xp-date{grid-column:3;grid-row:1;text-align:left;justify-self:start}
.xp-row.right .xp-card{grid-column:3;grid-row:1;justify-self:start}
.xp-row.right .xp-date{grid-column:1;grid-row:1;text-align:right;justify-self:end}
.xp-date{padding-top:22px;opacity:0.45;transition:opacity 0.7s;width:max-content;max-width:100%}
.xp-row.on .xp-date{opacity:1}
.xp-chap{font-family:'Inter',sans-serif;font-size:10px;color:var(--text3);letter-spacing:2.5px;text-transform:uppercase;margin-bottom:8px}
.xp-range{font-family:'Cormorant Garamond','Noto Sans TC',serif;font-size:30px;color:var(--text);letter-spacing:-0.5px;line-height:1.1;font-variant-numeric:tabular-nums}
.xp-dur{font-family:'Noto Sans TC',sans-serif;font-size:12.5px;color:var(--accent-text);margin-top:8px;letter-spacing:0.5px}
.xp-card{
  position:relative;
  max-width:460px;width:100%;padding:28px 30px 24px;border-radius:18px;
  /* glass: translucent tint + sheen; heavy blur keeps text legible */
  background:
    linear-gradient(135deg,rgba(255,255,255,0.55) 0%,rgba(255,255,255,0.22) 45%,rgba(255,255,255,0.32) 100%);
  -webkit-backdrop-filter:blur(26px) saturate(1.6);backdrop-filter:blur(26px) saturate(1.6);
  border:1px solid rgba(255,255,255,0.65);
  box-shadow:
    0 1px 0 rgba(255,255,255,0.95) inset,
    0 -1px 0 rgba(20,30,50,0.04) inset,
    0 0 0 1px rgba(20,30,50,0.05),
    0 28px 60px -32px rgba(20,30,50,0.32),

.xp-card::before{

.xp-row.on .xp-card{opacity:1;transform:none}

.xp-card:hover{border-color:rgba(143,190,220,0.7);box-shadow:0 1px 0 rgba(255,255,255,0.9) inset,0 32px 70px -30px rgba(40,90,130,0.4),0 4px 14px -8px rgba(20,30,50,0.12)}

}
[data-theme="dark"] .xp-card::after{

}
[data-theme="dark"] .xp-card .xp-hl li,[data-theme="dark"] .xp-card .xp-co{color:#c3c8d3}

.xp-card .xp-stat{background:rgba(143,190,220,0.18);border:1px solid rgba(143,190,220,0.22)}
[data-theme="dark"] .xp-card .xp-stat{background:rgba(143,190,220,0.12);border-color:rgba(143,190,220,0.2)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){

}
[data-theme="dark"] .xp-card:hover{border-color:rgba(143,190,220,0.45);box-shadow:0 1px 0 rgba(255,255,255,0.06) inset,0 30px 80px -30px rgba(70,130,180,0.35)}
.xp-card-date{display:none;font-family:'Inter','Noto Sans TC',sans-serif;font-size:11px;color:var(--accent-text);letter-spacing:1px;margin-bottom:10px}

.xp-co{font-family:'Inter','Noto Sans TC',sans-serif;font-size:12px;color:var(--text2);margin:6px 0 18px;letter-spacing:0.3px}
.xp-stats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.xp-stat{font-family:'Noto Sans TC','Inter',sans-serif;font-size:12px;padding:5px 11px;border-radius:999px;background:var(--accent-soft);color:var(--accent-text);font-weight:400}
.xp-hl{list-style:none;display:flex;flex-direction:column;gap:8px;padding-left:14px}
.xp-hl li{position:relative;font-family:'Noto Sans TC',sans-serif;font-size:13px;color:var(--text2);line-height:1.75;font-weight:300}
.xp-hl li::before{content:'';position:absolute;left:-13px;top:10px;width:4px;height:4px;border-radius:50%;background:var(--accent)}
.xp-more{display:grid;grid-template-rows:0fr;transition:grid-template-rows 0.45s cubic-bezier(0.22,1,0.36,1)}
.xp-more>div{overflow:hidden}
.xp-more.open{grid-template-rows:1fr}

.xp-toggle{

/* ══════════════════════════════
   CONTACT
══════════════════════════════ */
.contact-layout{display:grid;grid-template-columns:1fr 1fr;gap:96px}
.ct-h{
  font-family:'Cormorant Garamond','Noto Sans TC',serif;
  font-size:clamp(36px,4vw,56px);font-weight:400;
  color:var(--text);letter-spacing:-1px;line-height:1.15;margin-bottom:36px;
}
.ct-h em{color:var(--accent-text);font-style:italic}
.ct-sub{
  font-size:14.5px;color:var(--text2);line-height:1.85;
  font-family:'Noto Sans TC',sans-serif;font-weight:300;
  margin-bottom:48px;max-width:400px;
}
.ct-links{display:flex;flex-direction:column;gap:18px;border-top:1px solid var(--bdr);padding-top:32px}
.ct-link{
  display:grid;grid-template-columns:80px 1fr;gap:24px;align-items:center;
  font-size:14px;color:var(--text);font-family:'Inter',sans-serif;
  padding-bottom:14px;border-bottom:1px solid var(--bdr);
}
.ct-link:last-child{border-bottom:none;padding-bottom:0}
.ct-link-a{color:inherit;text-decoration:none;justify-self:start;display:inline-flex;align-items:center;gap:6px;
  background-image:linear-gradient(currentColor,currentColor);background-size:0 1px;background-repeat:no-repeat;background-position:0 100%;
  transition:color .25s,background-size .35s cubic-bezier(0.22,1,0.36,1)}
.ct-link-a:hover{color:var(--accent-text);background-size:100% 1px}
.ct-link-a:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
.ct-ext{font-size:11px;color:var(--text3);transition:transform .25s,color .25s}
.ct-link-a:hover .ct-ext{color:var(--accent-text);transform:translate(2px,-2px)}
@media (prefers-reduced-motion:reduce){.ct-link-a,.ct-ext{transition:none}}
.ct-link-label{
  font-size:10.5px;color:var(--text3);letter-spacing:1.5px;
  text-transform:uppercase;
}
.cform{
  display:flex;flex-direction:column;gap:24px;
  padding:36px;border-radius:20px;
  border:1px solid var(--bdr);
  background:color-mix(in srgb,var(--paper) 55%,transparent);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
}
.flabel{
  font-size:10.5px;color:var(--text2);letter-spacing:1.5px;
  text-transform:uppercase;font-family:'Inter',sans-serif;
  margin-bottom:10px;display:block;
}
.finput,.ftarea{
  background:color-mix(in srgb,var(--paper) 70%,transparent);
  border:1px solid var(--bdr2);border-radius:12px;
  padding:14px 16px;color:var(--text);font-size:14.5px;
  font-family:'Noto Sans TC',sans-serif;font-weight:300;
  outline:none;width:100%;resize:vertical;
  transition:border-color 0.25s,background 0.25s,box-shadow 0.25s;
}
.finput::placeholder,.ftarea::placeholder{color:var(--text3);opacity:1}
.finput:hover,.ftarea:hover{border-color:color-mix(in srgb,var(--text) 28%,transparent)}
.finput:focus,.ftarea:focus{
  border-color:var(--accent);background:var(--paper);
  box-shadow:0 0 0 4px var(--accent-soft);
}
.ftarea{height:140px}
.fsub{
  display:inline-flex;align-items:center;gap:12px;
  background:var(--text);color:var(--bg);border:none;cursor:pointer;
  font-family:'Inter',sans-serif;font-size:13px;
  padding:14px 26px;min-height:48px;border-radius:999px;margin-top:8px;
  transition:opacity 0.25s,background 0.25s;align-self:flex-end;
}
.fsub:hover{opacity:0.86}
.fsub:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.fsub.sent{background:var(--accent-soft);color:var(--accent-text)}
/* glass send button */
.fsub:not(.sent){
  color:var(--text);
  background:linear-gradient(135deg,rgba(143,190,220,0.62) 0%,rgba(143,190,220,0.30) 55%,rgba(143,190,220,0.42) 100%);

  border:1px solid rgba(255,255,255,0.7);
  box-shadow:0 1px 0 rgba(255,255,255,0.9) inset;
  transition:background 0.3s,box-shadow 0.3s,transform 0.3s,border-color 0.3s;
}
.fsub:not(.sent):hover{
  opacity:1;transform:translateY(-1px);
  background:linear-gradient(135deg,rgba(143,190,220,0.78) 0%,rgba(143,190,220,0.45) 55%,rgba(143,190,220,0.58) 100%);

}
[data-theme="dark"] .fsub:not(.sent){
  background:linear-gradient(135deg,rgba(143,190,220,0.30) 0%,rgba(143,190,220,0.10) 55%,rgba(143,190,220,0.18) 100%);

  box-shadow:0 1px 0 rgba(255,255,255,0.14) inset,0 14px 30px -16px rgba(0,0,0,0.8),0 0 18px -6px rgba(143,190,220,0.35);
}
[data-theme="dark"] .fsub:not(.sent):hover{
  background:linear-gradient(135deg,rgba(143,190,220,0.42) 0%,rgba(143,190,220,0.18) 55%,rgba(143,190,220,0.28) 100%);
  border-color:rgba(184,214,236,0.5);
  box-shadow:0 1px 0 rgba(255,255,255,0.18) inset,0 16px 34px -16px rgba(0,0,0,0.85),0 0 24px -4px rgba(143,190,220,0.5);
}
@media (prefers-reduced-motion:reduce){.fsub:not(.sent):hover{transform:none}}
/* inline field errors */
.cform{--err:#b3261e;--err-soft:rgba(179,38,30,0.12)}
[data-theme="dark"] .cform{--err:#f28b82;--err-soft:rgba(242,139,130,0.16)}
.finput.is-err,.ftarea.is-err,.finput.is-err:hover,.ftarea.is-err:hover{border-color:var(--err)}
.finput.is-err:focus,.ftarea.is-err:focus{border-color:var(--err);box-shadow:0 0 0 4px var(--err-soft)}
.ferr{

}
.fsub-arrow{transition:transform 0.3s}
.fsub:hover .fsub-arrow{transform:translateX(4px)}
@media (max-width:640px){.cform{padding:24px}}
/* contact page: fit in one screen */
.pg-contact{padding-bottom:48px}
.pg-contact .pg-header{margin-bottom:56px}
.pg-contact .contact-layout{gap:72px;align-items:start}
.pg-contact .ct-h{font-size:clamp(32px,3.2vw,46px);margin-bottom:16px}
.pg-contact .ct-sub{margin-bottom:32px}
.pg-contact .ct-links{gap:14px;padding-top:24px}
.pg-contact .ct-link{padding-bottom:12px}
.pg-contact .cform{gap:18px;padding:32px}
.pg-contact .ftarea{height:112px}

/* ══════════════════════════════
   CASE STUDY
══════════════════════════════ */
.cs-wrap{animation:pageIn 0.6s cubic-bezier(0.22,1,0.36,1)}
.cs-topbar{padding:72px 96px 0 80px;display:flex;align-items:center;justify-content:space-between;max-width:1480px;margin:0 auto;width:100%}
.cs-back{
  display:flex;align-items:center;gap:14px;
  font-size:12px;color:var(--text2);
  background:none;border:none;cursor:pointer;
  font-family:'Inter',sans-serif;padding:0;
  transition:gap 0.3s,color 0.25s;
}
.cs-back:hover{color:var(--accent-text);gap:20px}
.cs-back svg{transition:transform 0.3s}
.cs-back:hover svg{transform:translateX(-4px)}

.cs-hero{padding:40px 96px 0 80px;max-width:1480px;margin:0 auto;width:100%}
.cs-badge{

}
.cs-h1{
  font-family:'Cormorant Garamond','Noto Sans TC',serif;
  font-size:clamp(40px,5.5vw,84px);font-weight:400;
  color:var(--text);letter-spacing:-2px;line-height:1.12;margin-bottom:20px;
  max-width:1100px;
}
.cs-summary{
  font-size:16px;color:var(--text2);line-height:1.85;
  font-family:'Noto Sans TC',sans-serif;font-weight:300;
  max-width:620px;margin-bottom:56px;
}
.cs-meta-row{
  display:flex;gap:64px;flex-wrap:wrap;margin-bottom:0;
  padding:28px 0;border-top:1px solid var(--bdr);border-bottom:1px solid var(--bdr);
}
.cs-meta-label{
  font-size:10.5px;color:var(--text3);text-transform:uppercase;
  letter-spacing:1.5px;margin-bottom:6px;font-family:'Inter',sans-serif;
}
.cs-meta-val{font-size:14px;color:var(--text);font-weight:400;font-family:'Inter',sans-serif}

.cs-cover{width:100%;border-radius:0;overflow:hidden;border:1px solid var(--bdr);background:var(--bg2)}
.cs-cover img{width:100%;display:block}

/* body */
.cs-body-grid{
  display:grid;grid-template-columns:1fr 220px;gap:80px;
  padding:96px 96px 96px 80px;max-width:1480px;margin:0 auto;width:100%;
  align-items:start;
}
.cs-content{max-width:760px}
.cs-sec{margin-bottom:120px;scroll-margin-top:120px}
.cs-sec > :last-child{margin-bottom:0}
.cs-sec:has(> .cs-stage:last-child){margin-bottom:96px} /* mist padding already adds air below */
.cs-sec-label{
  font-family:'Inter',sans-serif;font-size:11px;color:var(--text3);
  letter-spacing:2px;margin-bottom:12px;
}
.cs-sec-h{
  font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:500;
  color:var(--text);letter-spacing:-0.6px;line-height:1.3;margin-bottom:24px;
}
.cs-text{font-size:15px;color:var(--text2);line-height:1.95;font-weight:300;font-family:'Noto Sans TC',sans-serif}
.cs-text p{margin-bottom:12px}
.cs-text p:last-child{margin-bottom:0}
.cs-hl{
  position:relative;overflow:hidden;
  background:linear-gradient(135deg,rgba(255,255,255,0.62) 0%,rgba(255,255,255,0.34) 55%,rgba(143,190,220,0.14) 100%);
  -webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);
  border:1px solid rgba(255,255,255,0.7);
  box-shadow:0 1px 0 rgba(255,255,255,0.9) inset,0 20px 44px -30px rgba(20,40,70,0.35);
  padding:24px 28px 24px 32px;margin:0;font-size:15px;color:var(--text);
  line-height:1.85;font-family:'Noto Sans TC',sans-serif;font-weight:400;
  border-radius:16px;
}
.cs-hl::before{
  content:'';position:absolute;left:0;top:18px;bottom:18px;width:3px;border-radius:0 3px 3px 0;
  background:linear-gradient(180deg,var(--accent),rgba(143,190,220,0.35));
}
[data-theme="dark"] .cs-hl{
  background:linear-gradient(135deg,rgba(40,48,62,0.62) 0%,rgba(26,31,41,0.42) 55%,rgba(143,190,220,0.12) 100%);
  border-color:rgba(255,255,255,0.10);
  box-shadow:0 1px 0 rgba(255,255,255,0.06) inset,0 24px 50px -30px rgba(0,0,0,0.8);
}
.cs-prob-list{list-style:none;display:flex;flex-direction:column;gap:0;border-top:1px solid var(--bdr)}
.cs-prob-item{
  display:grid;grid-template-columns:40px 1fr;gap:24px;
  font-size:15px;color:var(--text2);line-height:1.75;
  font-family:'Noto Sans TC',sans-serif;font-weight:300;
  padding:20px 0;border-bottom:1px solid var(--bdr);
}
.cs-prob-n{
  color:var(--accent-text);font-weight:500;font-family:'Inter',sans-serif;
  font-size:13px;font-variant-numeric:tabular-nums;letter-spacing:1px;
}
.ab-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:0}
.ab-card{
  border:1px solid var(--bdr);padding:24px 26px;background:var(--paper);
  transition:border-color 0.3s;
}
.ab-card.chosen{border-color:var(--accent);background:var(--accent-soft)}
.ab-tag{
  font-size:10.5px;color:var(--accent-text);letter-spacing:1.5px;
  text-transform:uppercase;margin-bottom:10px;font-family:'Inter',sans-serif;
}
.ab-name{
  font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:500;
  color:var(--text);margin-bottom:10px;letter-spacing:-0.3px;
}
.ab-desc{font-size:13px;color:var(--text2);line-height:1.75;font-family:'Noto Sans TC',sans-serif;font-weight:300}
.ab-badge{
  display:inline-flex;align-items:center;gap:6px;margin-top:14px;
  font-size:11px;color:var(--accent-text);font-family:'Inter',sans-serif;
  letter-spacing:0.5px;
}
.cs-img-block{margin:24px 0;border:1px solid var(--bdr)}
.cs-img-block img{width:100%;display:block}
.cs-img2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:24px 0}
.cs-img2 .cs-img-block{margin:0}
.refl-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px}
.refl-card{
  border:1px solid var(--bdr);padding:24px 26px;background:var(--paper);
  transition:border-color 0.3s;
}
.refl-card:hover{border-color:var(--accent)}
.refl-num{
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:32px;color:var(--accent-text);line-height:1;margin-bottom:14px;
  opacity:0.7;
}
.refl-desc{font-size:13.5px;color:var(--text2);line-height:1.8;font-family:'Noto Sans TC',sans-serif;font-weight:300}

/* TOC */
.cs-toc{position:sticky;top:120px}
.cs-toc-label{
  font-size:10.5px;color:var(--text3);letter-spacing:2px;
  text-transform:uppercase;margin-bottom:24px;font-family:'Inter',sans-serif;
  padding-bottom:14px;border-bottom:1px solid var(--bdr);
}
.toc-btn{
  display:flex;align-items:center;gap:12px;padding:9px 0;cursor:pointer;
  font-size:12.5px;color:var(--text3);font-family:'Inter',sans-serif;
  transition:color 0.25s;background:none;border:none;width:100%;text-align:left;
  letter-spacing:0.2px;
}
.toc-btn-num{
  font-size:10px;color:var(--text4);letter-spacing:1px;
  font-variant-numeric:tabular-nums;width:22px;
}
.toc-btn:hover{color:var(--text)}
.toc-btn:hover .toc-btn-num{color:var(--text2)}
.toc-btn.active{color:var(--accent-text)}
.toc-btn.active .toc-btn-num{color:var(--accent-text)}

/* ── case study blocks (Cake 內容重整 + Figma 圖片) ── */
a.pi{text-decoration:none;color:inherit}
a.pi:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.pi-tags,.cs-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.pi-tag{
  font-family:'Inter','Noto Sans TC',sans-serif;font-size:11px;letter-spacing:0.3px;
  padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-text);
}
/* hover peek of the cover in the list */
.pi-peek{
  position:absolute;right:70px;top:50%;width:132px;height:auto;z-index:2;pointer-events:none;
  opacity:0;transform:translate(16px,-50%) rotate(4deg) scale(0.92);
  transition:opacity .45s cubic-bezier(0.22,1,0.36,1),transform .55s cubic-bezier(0.22,1,0.36,1);
  filter:drop-shadow(0 18px 28px rgba(20,40,70,.18));
}
.pi:hover .pi-peek{opacity:1;transform:translate(0,-50%) rotate(-2deg) scale(1)}

/* more work — cards at the end of each case study */
.cs-more{margin:0 0 56px;padding-top:56px;border-top:1px solid var(--bdr)}
.cs-more-head{display:flex;align-items:baseline;gap:16px;margin-bottom:24px}
.cs-more-eyebrow{font-family:'Inter',sans-serif;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--text3)}
.cs-more-h{font-family:'Noto Sans TC',sans-serif;font-size:15px;font-weight:400;color:var(--text2);letter-spacing:1px}
.cs-more-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.mw-card{
  position:relative;display:flex;flex-direction:column;text-decoration:none;color:inherit;
  border-radius:18px;overflow:hidden;border:1px solid var(--bdr);
  background:color-mix(in srgb,var(--paper) 62%,transparent);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  transition:transform .45s cubic-bezier(0.22,1,0.36,1),box-shadow .45s,border-color .3s;
}
.mw-card:hover{transform:translateY(-4px);border-color:var(--bdr2);box-shadow:0 26px 48px -30px rgba(20,40,70,.35)}
.mw-card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.mw-thumb{
  aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:radial-gradient(ellipse at 50% 60%,var(--accent-soft),transparent 70%);
}
.mw-thumb img{max-width:62%;max-height:84%;width:auto;height:auto;object-fit:contain;
  filter:drop-shadow(0 16px 24px rgba(20,40,70,.16));
  transition:transform .6s cubic-bezier(0.22,1,0.36,1)}
.mw-card:hover .mw-thumb img{transform:scale(1.04) rotate(-1deg)}
.mw-body{position:relative;padding:18px 52px 20px 22px;border-top:1px solid var(--bdr)}
.mw-num{font-family:'Inter',sans-serif;font-size:10.5px;letter-spacing:1.5px;color:var(--text3);margin-bottom:8px}
.mw-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:500;line-height:1.15;color:var(--text)}
.mw-title-tw{font-family:'Noto Sans TC',sans-serif;font-size:12.5px;color:var(--text2);margin-top:4px}
.mw-arrow{
  position:absolute;right:20px;top:50%;transform:translateY(-50%);
  width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--bdr2);color:var(--text2);transition:all .35s cubic-bezier(0.22,1,0.36,1);
}
.mw-card:hover .mw-arrow{background:var(--accent);border-color:var(--accent);color:#fff;transform:translate(3px,-50%)}
@media (max-width:640px){.cs-more-grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.mw-card,.mw-thumb img,.mw-arrow{transition:none}}

/* hero: title left, mockup right */
.cs-hero-split{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,0.95fr);gap:48px;align-items:center;margin-bottom:56px}
.cs-hero-split.solo{grid-template-columns:1fr}
.cs-hero-split .cs-h1{font-size:clamp(40px,4.4vw,72px)}
.cs-hero-split .cs-summary{margin-bottom:28px}
.cs-hero-text .cs-tags{margin-top:0}

/* mockup stage with mist illustration */
.cs-stage{margin:0;display:flex;flex-direction:column;align-items:center}
.cs-stage.is-hero{margin:0}
.cs-stage-inner{position:relative;width:100%;margin:0 auto;padding:6% 8%;display:flex;justify-content:center;align-items:center}
.cs-mist{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;overflow:visible}
.cs-mist-blob{animation:csMistDrift 18s ease-in-out infinite alternate;transform-origin:300px 250px}
.cs-mist-orbit{animation:csOrbit 60s linear infinite;transform-box:fill-box;transform-origin:center}
.cs-mist-dots circle{animation:csTwinkle 4.5s ease-in-out infinite}
.cs-mist-dots circle:nth-child(2n){animation-delay:-2.2s}
@keyframes csMistDrift{0%{transform:scale(1) rotate(0)}100%{transform:scale(1.05) rotate(4deg)}}
@keyframes csOrbit{to{transform:rotate(360deg)}}
@keyframes csTwinkle{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.cs-mist-blob,.cs-mist-orbit,.cs-mist-dots circle{animation:none}}
[data-theme="dark"] .cs-mist{opacity:.55}
.cs-stage-main{position:relative;z-index:1;width:100%;height:auto;display:block}
.cs-stage.card .cs-stage-main{border-radius:18px;box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 30px 60px -30px rgba(20,40,70,.35)}
.cs-stage.fade .cs-stage-inner{padding-bottom:0}
.cs-stage.fade .cs-stage-main{-webkit-mask-image:linear-gradient(180deg,#000 72%,transparent);mask-image:linear-gradient(180deg,#000 72%,transparent)}
.cs-stage-inner.duo .cs-stage-main{margin-right:auto}
.cs-stage-inner.duo.float-left .cs-stage-main{margin-right:0;margin-left:auto}
.cs-stage-float{
  position:absolute;z-index:2;height:auto;bottom:4%;
  filter:drop-shadow(0 26px 34px rgba(20,40,70,.22));
}
.cs-stage-inner.float-right .cs-stage-float{right:2%}
.cs-stage-inner.float-left .cs-stage-float{left:4%;bottom:2%}

/* text blocks */
.cs-lead{
  font-family:'Noto Sans TC',sans-serif;font-size:19px;line-height:1.75;font-weight:400;
  color:var(--text);margin-bottom:0;letter-spacing:0.2px;
}
.cs-bullets{list-style:none;margin:0;display:flex;flex-direction:column;gap:8px}
.cs-bullets li{
  position:relative;padding-left:20px;font-size:15px;color:var(--text2);line-height:1.8;
  font-family:'Noto Sans TC',sans-serif;font-weight:300;
}
.cs-bullets li::before{
  content:'';position:absolute;left:2px;top:0.78em;width:6px;height:6px;border-radius:50%;
  background:var(--accent);
}
.cs-out{
  display:flex;gap:12px;margin:0;font-size:15px;line-height:1.8;
  color:var(--accent-text);font-family:'Noto Sans TC',sans-serif;font-weight:500;
}
.cs-out span{flex:none;font-family:'Inter',sans-serif}

/* glass cards */
.cs-pillar,.cs-step,.cs-finding{
  position:relative;border-radius:16px;
  background:rgba(255,255,255,0.72);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border:1px solid rgba(20,30,50,0.09);
  box-shadow:0 1px 0 rgba(255,255,255,0.9) inset,0 20px 44px -30px rgba(20,30,50,0.35);
}
[data-theme="dark"] .cs-pillar,[data-theme="dark"] .cs-step,[data-theme="dark"] .cs-finding{
  background:rgba(26,31,41,0.78);border-color:rgba(255,255,255,0.09);
  box-shadow:0 1px 0 rgba(255,255,255,0.05) inset,0 24px 50px -30px rgba(0,0,0,0.8);
}
.cs-pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:0}
.cs-pillar{padding:20px 20px 22px;transition:border-color .3s,transform .4s cubic-bezier(0.22,1,0.36,1)}
.cs-pillar:hover{border-color:rgba(143,190,220,.7);transform:translateY(-3px)}
.cs-pillar-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.cs-pillar-ic{
  width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:var(--accent-text);
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.9),rgba(143,190,220,.28) 70%);
  box-shadow:0 0 0 1px rgba(143,190,220,.35) inset,0 8px 20px -10px rgba(70,130,180,.6);
}
[data-theme="dark"] .cs-pillar-ic{background:radial-gradient(circle at 30% 25%,rgba(143,190,220,.35),rgba(143,190,220,.08) 70%)}
.cs-pillar-n{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:26px;line-height:1;color:var(--text4)}
.cs-pillar-t{font-family:'Noto Sans TC',sans-serif;font-size:15px;font-weight:500;color:var(--text);margin-bottom:6px}
.cs-pillar-d{font-family:'Noto Sans TC',sans-serif;font-size:13px;line-height:1.7;color:var(--text2);font-weight:300}

/* steps */
.cs-steps{display:grid;gap:20px;margin:0;list-style:none}
.cs-steps.web{grid-template-columns:repeat(2,1fr)}
.cs-steps.phone{grid-template-columns:repeat(4,1fr);gap:12px}
.cs-step{overflow:hidden;transition:border-color .3s,transform .4s cubic-bezier(0.22,1,0.36,1)}
.cs-step:hover{transform:translateY(-3px)}
.cs-step.key{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset,0 24px 50px -28px rgba(70,130,180,0.55)}
.cs-step-shot{background:linear-gradient(160deg,#eef4f8,#f8f5f0);border-bottom:1px solid rgba(20,30,50,.06)}
.cs-steps.web .cs-step-shot{padding:12px 12px 0}
.cs-steps.web .cs-step-shot img{display:block;width:100%;height:auto;border-radius:8px 8px 0 0;box-shadow:0 -1px 0 rgba(20,30,50,.06),0 10px 24px -14px rgba(20,40,70,.35)}
.cs-steps.phone .cs-step-shot{padding:14px 14px 0;height:250px;overflow:hidden}
.cs-steps.phone .cs-step-shot img{display:block;width:100%;height:auto;border-radius:16px 16px 0 0;box-shadow:0 0 0 4px #fff,0 0 0 5px rgba(20,30,50,.08),0 14px 30px -14px rgba(20,40,70,.4)}
.cs-step-body{padding:14px 16px 18px}
.cs-step-n{font-family:'Inter',sans-serif;font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
.cs-step.key .cs-step-n{color:var(--accent-text)}
.cs-step-t{font-family:'Noto Sans TC',sans-serif;font-size:14px;font-weight:500;color:var(--text);line-height:1.5;margin-bottom:4px}
.cs-step-d{font-family:'Noto Sans TC',sans-serif;font-size:12.5px;line-height:1.65;color:var(--text2);font-weight:300}
.cs-step-star{color:var(--accent-text)}

/* finding + table */
.cs-finding{padding:24px 28px;margin:0}
.cs-finding-t{font-family:'Noto Sans TC',sans-serif;font-size:16px;font-weight:500;color:var(--text);margin-bottom:10px}
.cs-finding p{font-size:14.5px;color:var(--text2);line-height:1.85;font-family:'Noto Sans TC',sans-serif;font-weight:300;margin-bottom:6px}
.cs-finding .cs-bullets{margin:8px 0 10px}
.cs-table-wrap{overflow-x:auto;margin:0;border-top:1px solid var(--bdr2)}
.cs-table{width:100%;min-width:620px;border-collapse:collapse;font-family:'Noto Sans TC',sans-serif;font-size:13px}
.cs-table th,.cs-table td{text-align:left;padding:13px 12px 13px 0;border-bottom:1px solid var(--bdr);vertical-align:top;line-height:1.6}
.cs-table thead th{font-family:'Inter','Noto Sans TC',sans-serif;font-size:11px;letter-spacing:1px;color:var(--text3);font-weight:500}
.cs-table tbody th{color:var(--text);font-weight:500}
.cs-table td{color:var(--text2);font-weight:300}

/* QA gallery */
.cs-gallery{display:grid;grid-template-columns:1fr;gap:40px;margin:0}
.cs-shot-frame{
  border-radius:16px;overflow:hidden;background:#fff;
  border:1px solid rgba(20,30,50,.08);
  box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 26px 56px -34px rgba(20,40,70,.45);
}
.cs-shot-frame img{display:block;width:100%;height:auto}
.cs-fig-cap{margin-top:16px;font-family:'Noto Sans TC',sans-serif;font-size:12px;color:var(--text3);text-align:center;letter-spacing:0.3px}

@media (max-width:1100px){
  .cs-steps.phone{grid-template-columns:repeat(2,1fr)}
  .cs-steps.phone .cs-step-shot{height:300px}
}
@media (max-width:900px){
  .cs-hero-split{grid-template-columns:1fr;gap:8px}
  .cs-stage.is-hero .cs-stage-inner{max-width:460px}
  .pi-peek{display:none}
}
@media (max-width:640px){
  .cs-pillars,.cs-steps.web{grid-template-columns:1fr}
  .cs-steps.phone .cs-step-shot{height:220px}
  .cs-lead{font-size:17px}
}


/* pain → solution */
.cs-ps{margin:0;border-radius:16px;overflow:hidden;border:1px solid var(--bdr)}
.cs-ps-row{display:grid;grid-template-columns:76px 1fr;gap:16px;padding:16px 20px;align-items:baseline}
.cs-ps-row p{font-family:'Noto Sans TC',sans-serif;font-size:14.5px;line-height:1.8;color:var(--text2);font-weight:300}
.cs-ps-row.pain{background:rgba(242,201,176,.16)}
.cs-ps-row.pain .cs-ps-pain{color:var(--text);font-weight:500}
.cs-ps-row.fix{background:var(--accent-soft);border-top:1px solid var(--bdr)}
.cs-ps-row.fix p{color:var(--text)}
.cs-ps-tag{font-family:'Noto Sans TC',sans-serif;font-size:11.5px;letter-spacing:1px;color:var(--text3);white-space:nowrap}
.cs-ps-row.pain .cs-ps-tag{color:#a8633a}
[data-theme="dark"] .cs-ps-row.pain .cs-ps-tag{color:#f2c9b0}
.cs-ps-row.fix .cs-ps-tag{color:var(--accent-text)}
.cs-ps-note{padding:14px 20px 12px 112px;border-top:1px solid var(--bdr)}
.cs-ps-note p{font-family:'Noto Sans TC',sans-serif;font-size:13.5px;line-height:1.8;color:var(--text2);font-weight:300;margin-bottom:6px}
.cs-ps-note .cs-bullets li{font-size:13.5px}
.cs-link-row{margin:0}
/* vertical rhythm inside a section: text → 16 / blocks → 24 / visuals → 32 */
.cs-sec > * + :is(.cs-bullets,.cs-text){margin-top:16px}
.cs-sec > * + :is(.cs-pillars,.ab-grid,.cs-table-wrap,.cs-finding,.cs-ps,.cs-hl,.cs-out,.cs-link-row,.cs-prob-list){margin-top:24px}
.cs-sec > * + :is(.cs-stage,.cs-steps,.cs-gallery){margin-top:32px}
.cs-sec > .cs-sec-label + .cs-sec-h,.cs-sec > .cs-sec-h + *{margin-top:0}
.cs-link{font-family:'Inter','Noto Sans TC',sans-serif;font-size:13px;color:var(--accent-text);text-decoration:none;border-bottom:1px solid rgba(143,190,220,.6);padding-bottom:2px;transition:border-color .25s}
.cs-link:hover{border-color:var(--accent-text)}
@media (max-width:640px){
  .cs-ps-row{grid-template-columns:1fr;gap:4px}
  .cs-ps-note{padding-left:20px}
}

/* ══════════════════════════════
   IMAGE ZOOM + MOBILE IMAGE LAYOUT
══════════════════════════════ */
.cs-step-shot,.cs-shot-frame{position:relative}
.cs-zoom{position:absolute;inset:0;z-index:3;background:none;border:0;padding:0;margin:0;cursor:zoom-in;-webkit-tap-highlight-color:transparent}
.cs-zoom:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:12px}
.cs-zoom-chip{
  position:absolute;right:10px;bottom:10px;width:32px;height:32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:var(--text);
  background:color-mix(in srgb,var(--paper) 82%,transparent);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border:1px solid var(--bdr);box-shadow:0 6px 16px -8px rgba(20,40,70,.4);
  opacity:0;transform:scale(.9);transition:opacity .25s,transform .25s;
}
.cs-zoom:hover .cs-zoom-chip,.cs-zoom:focus-visible .cs-zoom-chip{opacity:1;transform:none}
@media (hover:none){.cs-zoom-chip{opacity:1;transform:none}}
.cs-lb{
  width:min(1200px,94vw);max-width:none;max-height:92dvh;margin:auto;padding:0;
  border:1px solid var(--bdr);border-radius:20px;background:var(--bg);color:var(--text);
  overflow:auto;overscroll-behavior:contain;box-shadow:0 40px 90px -30px rgba(10,20,40,.55);
}
.cs-lb::backdrop{background:rgba(12,18,28,.62);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.cs-lb-close{
  position:sticky;top:12px;margin:12px 12px -56px auto;z-index:2;display:flex;
  width:44px;height:44px;border-radius:50%;align-items:center;justify-content:center;cursor:pointer;
  background:color-mix(in srgb,var(--paper) 88%,transparent);border:1px solid var(--bdr);color:var(--text);
}
.cs-lb-body{padding:56px clamp(12px,3vw,40px) 28px;display:flex;flex-direction:column;align-items:center;gap:24px}
.cs-lb-item{width:100%;display:flex;justify-content:center}
.cs-lb-item img{display:block;width:100%;height:auto;border-radius:10px}
.cs-lb-hint{display:none;font-family:'Noto Sans TC',sans-serif;font-size:12px;color:var(--text3)}
.cs-lb-cap{font-family:'Noto Sans TC',sans-serif;font-size:13px;color:var(--text2);text-align:center}
.cs-swipe-hint{display:none}

@media (max-width:640px){
  /* stage: give the picture the full column width */
  .cs-stage-inner{padding:4% 0}
  .cs-stage.card .cs-stage-inner{padding:2% 0}
  .cs-stage.card .cs-stage-main{border-radius:12px}
  .cs-stage.is-hero .cs-stage-inner{max-width:360px}
  .cs-stage-inner.duo .cs-stage-main{width:80%!important}
  .cs-stage-inner.float-right .cs-stage-float{width:50%!important;right:0}
  .cs-stage-inner.float-left .cs-stage-float{width:40%!important;left:0}
  .cs-fig-cap{margin-top:10px}

  /* steps: swipeable row instead of a tall stack */
  .cs-steps.web,.cs-steps.phone{
    display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;
    margin-left:-24px;margin-right:-24px;padding:4px 24px 16px;scroll-padding:0 24px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  .cs-steps::-webkit-scrollbar{display:none}
  .cs-steps .cs-step{flex:0 0 84%;scroll-snap-align:start}
  .cs-steps.phone .cs-step{flex-basis:68%}
  .cs-steps.phone .cs-step-shot{height:340px}
  .cs-step:hover{transform:none}
  .cs-swipe-hint{
    display:block;margin-top:8px;text-align:center;
    font-family:'Noto Sans TC',sans-serif;font-size:12px;color:var(--text3);letter-spacing:.5px;
  }

  .cs-gallery{gap:28px}
  .cs-shot-frame{border-radius:12px}

  /* lightbox goes full screen; wide before/after shots get room to pan */
  .cs-lb{width:100vw;height:100dvh;max-height:none;border-radius:0;border:0}
  .cs-lb-body{padding:64px 0 32px;align-items:stretch}
  .cs-lb-item{overflow-x:auto;justify-content:flex-start;padding:0 16px;-webkit-overflow-scrolling:touch}
  .cs-lb-item img{width:100%}
  .cs-lb-item.wide img{width:180vw;flex:none}
  .cs-lb-hint{display:block;text-align:center}
  .cs-lb-cap{padding:0 20px}
}
@media (prefers-reduced-motion:reduce){.cs-zoom-chip{transition:none}}

/* ══════════════════════════════
   MOBILE MENU OVERLAY
══════════════════════════════ */
.mob-overlay{
  position:fixed;inset:0;z-index:100;background:var(--bg);
  display:flex;flex-direction:column;align-items:flex-start;justify-content:center;
  padding:0 48px;gap:8px;
  opacity:0;pointer-events:none;
  transition:opacity 0.4s cubic-bezier(0.22,1,0.36,1);
}
.mob-overlay.open{opacity:1;pointer-events:all}
.mob-overlay-num{
  font-family:'Inter',sans-serif;font-size:10.5px;color:var(--text3);
  letter-spacing:2px;margin-bottom:8px;
}
.mob-btn{
  display:flex;align-items:baseline;gap:16px;
  background:none;border:none;cursor:pointer;
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(40px,9vw,72px);font-weight:400;
  color:var(--text);letter-spacing:-1.5px;line-height:1.1;
  padding:8px 0;text-align:left;transition:color 0.25s;
}
.mob-btn-num{
  font-family:'Inter',sans-serif;font-size:11px;color:var(--text3);
  letter-spacing:1.5px;font-weight:400;
}
.mob-btn:hover,.mob-btn.active{color:var(--accent-text)}
.mob-btn:hover .mob-btn-num,.mob-btn.active .mob-btn-num{color:var(--accent-text)}
.mob-close{
  position:absolute;top:28px;right:48px;
  width:38px;height:38px;border-radius:50%;
  background:var(--paper);border:1px solid var(--bdr);
  cursor:pointer;color:var(--text);
  display:flex;align-items:center;justify-content:center;
}

/* ══════════════════════════════
   RESPONSIVE
══════════════════════════════ */
@media(max-width:1199px) and (min-width:768px){
  .rail{width:64px}
  .rail:hover{width:200px}
  .main{margin-left:64px}
  .side-l{left:80px}
  .side-l,.side-r,.bottom-l,.bottom-r{display:none}
  .hero{padding:80px 48px 64px;grid-template-columns:1fr 1fr;gap:32px}
  .hero-right{min-height:480px}
  .hero-right .sculpture-canvas{opacity:0.85}
  .pg{padding:80px 48px}
  .pg-header{gap:24px}
  .pg-sub{text-align:left;justify-self:start}
  .work-section{padding:0 48px 80px}
  .av4-profile{grid-template-columns:260px 1fr;gap:40px}
  .av4-photo{width:260px;height:340px}
  .av4-stats{grid-template-columns:repeat(2,1fr);gap:32px 0}
  .zigzag{padding:48px 4% 60px}
  .contact-layout{grid-template-columns:1fr;gap:48px}
  .cs-topbar,.cs-hero{padding-left:48px;padding-right:48px;padding-top:64px}
  .cs-hero{padding-top:32px}
  .cs-body-grid{padding:60px 48px 96px;grid-template-columns:1fr 200px;gap:48px}
  .pi{grid-template-columns:48px 1fr 1fr 130px;gap:24px}
  .xp-row{grid-template-columns:1fr 104px 1fr}
  .xp-card{padding:22px 22px 20px}
  .xp-range{font-size:24px}

/* ══════════════════════════════

══════════════════════════════ */
.main{margin-left:0}

}
.tnav{
  pointer-events:auto;width:100%;max-width:960px;height:60px;padding:6px;

  border:1px solid rgba(255,255,255,0.65);
  box-shadow:
    0 1px 0 rgba(255,255,255,0.95) inset,
    0 -1px 0 rgba(20,30,50,0.04) inset,
    0 0 0 1px rgba(20,30,50,0.05),
    0 18px 40px -24px rgba(20,30,50,0.28);
}
[data-theme="dark"] .tnav{

.tnav-logo{

/* ══════════════════════════════
   v5.2 — TYPE SYSTEM · WCAG 2.2 AA
   Fonts unchanged (Cormorant Garamond / Inter / Noto Sans TC·JP).
   One weight scale + one colour scale for the whole site:
   · Body & paragraphs ............ 400
   · Labels / eyebrows / tags ...... 500, min 11px
   · Card titles & emphasis ........ 500
   · Serif display ≥36px ........... 400 ; serif 13–32px ... 500
   Colour (checked on the darkest fog tone #d5d6d0 / dark glass #2a313d):
   text 12:1 · text2 ≥6.8:1 · text3 ≥4.6:1 · accent-text ≥4.7:1
══════════════════════════════ */

/* body — 300 → 400 everywhere */
.hero-sub,.hero-jp,.pg-sub,.pi-title-tw,.pi-summary,.av4-info-list li,.zz-desc-cn,.av4-bio,
.step-desc,.sp,.xp-hl li,.exp-chap-hl li,.ct-sub,.finput,.ftarea,.cs-summary,.cs-text,
.cs-prob-item,.ab-desc,.refl-desc,.cs-bullets li,.cs-pillar-d,.cs-step-d,.cs-finding p,
.cs-table td,.cs-ps-row p,.cs-ps-note p,.mw-title-tw,.cs-lb-cap,.cs-fig-cap{font-weight:400}

/* labels — 500, nothing under 11px */
.pg-num,.pg-jp,.hero-eyebrow-text,.pi-num,.pi-year,.ws-num,.av4-intro-greeting,.av4-eyebrow,
.av4-info-label,.av4-stat-label,.av4-section-label,.av4-skill-cat-label,.zz-desc-en,.av4-greeting,
.av4-img-num,.av4-sec-num,.step-num,.skill-block-label,.xp-chap,.xp-tags,.exp-chap-label,
.exp-chap-tags,.ct-link-label,.flabel,.cs-badge,.cs-meta-label,.cs-sec-label,.ab-tag,
.cs-toc-label,.toc-btn-num,.cs-more-eyebrow,.mw-num,.cs-step-n,.cs-ps-tag,.mob-overlay-num,
.mob-btn-num,.edge-hint,.side-l,.side-r-item,.rail-brand-role,.rail-label,.pi-tag,.xp-stat{font-weight:500}
.rail-brand-role,.rail-label,.side-l,.side-r-item,.edge-hint,.av4-stat-label,.zz-desc-en,
.av4-img-num,.step-num,.exp-chap-label,.xp-chap,.xp-tags,.exp-chap-tags,.ct-link-label,.flabel,
.cs-meta-label,.ab-tag,.cs-toc-label,.toc-btn-num,.mw-num,.cs-step-n,.mob-overlay-num{font-size:11px}

/* emphasis — 500 */
.cs-hl,.cs-more-h,.cs-meta-val,.hero-meta-status{font-weight:500}

/* serif at mid sizes reads thin at 400 → 500 */
.rail-brand-name,.av4-img-caption,.zz-title,.xp-range,.xp-role,.refl-num,.cs-pillar-n{font-weight:500}

/* text that used the decorative --text4 now uses an AA colour */
.toc-btn-num,.cs-pillar-n{color:var(--text3)}
[data-theme="dark"] .xp-card .xp-tags{color:var(--text3)}
.cs-ps-row.pain .cs-ps-tag{color:#82471f}
.refl-num{opacity:1}

/* icons on the light-blue hover fill: dark ink in both themes */
.pi:hover .pi-arrow,.mw-card:hover .mw-arrow{color:#15181f}

/* dimmed states: dim with an AA colour, never with opacity on text */
.xp-card{opacity:1}
.xp-date{opacity:1}
.xp-date>*{transition:color .7s}
.xp-row:not(.on) .xp-date>*{color:var(--text3)}
.zigzag[data-live] .zz-desc-cn,
.zigzag[data-live] .zz-desc-en,
.zigzag[data-live] .zz-title{opacity:1;color:var(--text3)}
.zigzag[data-live] .zz-step[data-lit] .zz-title{color:var(--text)}

   Chinese is the default; small labels (eyebrows, section labels, tags) stay English.
══════════════════════════════ */
/* CJK fallback for serif headings, so Chinese never drops to the system serif */

/* ══════════════════════════════
   v5.9 — HERO TITLE · fixed words + one rotating blue word
   Keeps the v5.7 full-width line; each “fixed + word” pair is one line.
   EN  Cormorant Garamond (unchanged)
   中  Noto Sans TC 300/400 — light, sized for CJK, not EN (v5.16: was Noto Serif TC)
   日  Noto Sans JP (unchanged tone)
══════════════════════════════ */
.hero-h1.hero-title{max-width:none;margin-bottom:0;color:var(--text);font-synthesis:none}
.hx-line{display:block}
.hx-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* all words share one grid cell → the slot is always as wide as the longest word, so nothing jumps */
.hx-word{display:inline-grid;vertical-align:baseline;color:var(--accent-text)}
.hx-w{
  grid-area:1/1;white-space:nowrap;opacity:0;transform:translate3d(0,.3em,0);
  transition:opacity .6s cubic-bezier(.22,1,.36,1),transform .9s cubic-bezier(.22,1,.36,1);
}
.hx-w.is-on{opacity:1;transform:none;transition-delay:.14s}
.hx-w.is-out{opacity:0;transform:translate3d(0,-.2em,0);transition-duration:.42s,.6s;transition-delay:0s}
@media (prefers-reduced-motion:reduce){.hx-w{transition:none!important;transform:none!important}}

/* English — blue word in Cormorant italic */
html[lang] .hero-h1.hero-title--en{

  font-size:clamp(46px,5vw,88px);line-height:1.08;letter-spacing:-0.02em;
}

/* 中文 — Noto Sans TC 300, open tracking and leading; blue word one step heavier */
html[lang] .hero-h1.hero-title--zh{
  font-family:'Noto Sans TC',sans-serif;
  font-weight:300;font-style:normal;
  font-size:clamp(40px,4.4vw,72px);line-height:1.36;letter-spacing:.08em;
}
.hero-title--zh .hx-word{font-weight:400;margin-left:.08em}

/* 日本語 — current Noto Sans JP tone, sized so the longer line stays on one row */
html[lang] .hero-h1.hero-title--ja{
  font-family:'Noto Sans JP',sans-serif;font-weight:400;font-style:normal;
  font-size:clamp(32px,3.6vw,60px);line-height:1.45;letter-spacing:.05em;line-break:strict;
}

@media (max-width:1199px) and (min-width:768px){
  html[lang] .hero-h1.hero-title--en{font-size:clamp(40px,5.2vw,58px)}
  html[lang] .hero-h1.hero-title--zh{font-size:clamp(36px,4.8vw,54px)}
  html[lang] .hero-h1.hero-title--ja{font-size:clamp(28px,3.6vw,42px)}
}
@media (max-width:767px){
  .hero-h1.hero-title{white-space:normal}
  html[lang] .hero-h1.hero-title--en{font-size:clamp(40px,11.5vw,54px);line-height:1.04}
  html[lang] .hero-h1.hero-title--zh{font-size:clamp(34px,10vw,46px);letter-spacing:.06em}
  html[lang] .hero-h1.hero-title--ja{font-size:min(30px,7.4vw);letter-spacing:.03em}
  /* EN / JA: the blue word takes its own line instead of wrapping unpredictably */
  :is(.hero-title--en,.hero-title--ja) .hx-word{display:grid;margin-left:0}
  .hero-title--en .hx-line + .hx-line{margin-top:.24em}
}

/* v5.10 — hero CTA stays a quiet text link; accent colour + heavier weight so it reads as the action */
.hero-foot{margin-top:40px}

   v5.16 — FONT CLEAN-UP · one Chinese family, one Japanese family
   EN  Cormorant Garamond (display) + Inter (UI / labels)
   中  Noto Sans TC for every Chinese character, headings included
   日  Noto Sans JP for every Japanese character

/* mixed 中英 titles ("Mobile 訂位體驗", "Starbucks App｜…"): one family for the whole line, no serif→sans switch mid-title */
html[lang^="zh"] :is(.pi-title,.mw-title,.cs-h1,.cs-sec-h,.ab-name,.xp-role){font-family:'Noto Sans TC',sans-serif}
html[lang="ja"] :is(.pi-title,.mw-title,.cs-h1,.cs-sec-h,.ab-name,.xp-role){font-family:'Noto Sans JP',sans-serif}

.sk-row{
  display:grid;grid-template-columns:minmax(150px,200px) minmax(220px,300px) minmax(0,1fr);
  column-gap:48px;align-items:baseline;padding:36px 0 38px;border-bottom:1px solid var(--bdr);
}
.sk-meta{display:flex;flex-direction:column;gap:10px}
.sk-num{font-family:'Inter',sans-serif;font-size:11px;font-weight:500;letter-spacing:2px;color:var(--accent-text);font-variant-numeric:tabular-nums lining-nums}
.sk-en{font-family:'Inter',sans-serif;font-size:11px;font-weight:500;letter-spacing:2.5px;text-transform:uppercase;color:var(--text3);line-height:1.6}
.sk-title{
  font-family:'Cormorant Garamond','Noto Sans TC',serif;font-size:28px;font-weight:500;
  color:var(--text);letter-spacing:-0.3px;line-height:1.25;margin:0;
}
html[lang^="zh"] .sk-title{font-family:'Noto Sans TC',sans-serif;font-size:21px;letter-spacing:0.06em;line-height:1.45}
html[lang="ja"] .sk-title{font-family:'Noto Sans JP',sans-serif;font-size:19px;letter-spacing:0.04em;line-height:1.5}
.sk-items{
  margin:0;font-family:'Inter','Noto Sans TC',sans-serif;font-size:15px;font-weight:400;
  line-height:2;color:var(--text2);
}
html[lang="ja"] .sk-items{font-family:'Inter','Noto Sans JP',sans-serif}
.sk-items{overflow:hidden}
/* separators sit before each item; the one that would open a new line is pushed into the clipped margin */
.sk-items-in{display:flex;flex-wrap:wrap;margin-left:-2.2em}
.sk-item{white-space:nowrap}
.sk-item::before{content:"/";content:"/" / "";display:inline-block;width:2.2em;text-align:center;color:var(--text4)}
.sk-note{color:var(--accent-text);font-weight:500}
/* the row being read: number and title warm up slightly */
.sk-row:hover .sk-title{color:var(--accent-text)}
.sk-title{transition:color .3s}
@media (prefers-reduced-motion:reduce){.sk-title{transition:none}}
@media (max-width:1199px) and (min-width:768px){
  .sk-row{grid-template-columns:150px minmax(0,1fr);row-gap:10px;column-gap:40px}
  .sk-meta{grid-row:1 / span 2}
  .sk-title{grid-column:2}
  .sk-items{grid-column:2}
}
@media (max-width:767px){
  .av4-skills-wrap .av4-section-head{margin-bottom:36px}
  .sk-row{grid-template-columns:1fr;row-gap:10px;padding:26px 0 28px}
  .sk-meta{flex-direction:row;align-items:baseline;gap:14px}
  .sk-title{font-size:24px}
  html[lang^="zh"] .sk-title{font-size:19px}
  html[lang="ja"] .sk-title{font-size:18px}
  .sk-items{font-size:14.5px;line-height:1.95}
  .sk-items-in{margin-left:-1.6em}
  .sk-item::before{width:1.6em}
}
/* v5.17 — no repeated title: left = number + English category, right = skills in two short lines with “·” */
.sk-row{grid-template-columns:minmax(200px,300px) minmax(0,1fr);column-gap:56px;align-items:baseline}
.sk-meta{flex-direction:row;align-items:baseline;gap:18px;margin:0}
.sk-en{margin:0;font-size:12px;letter-spacing:2.5px;color:var(--text);font-weight:500;line-height:1.6}
.sk-items{font-size:16px;line-height:1.9;color:var(--text2)}
.sk-items-in{margin-left:-1.9em}
.sk-items-in + .sk-items-in{margin-top:2px}
.sk-item::before{content:"·";content:"·" / "";width:1.9em;color:var(--text3)}
.sk-row:hover .sk-en{color:var(--accent-text)}
.sk-en{transition:color .3s}
@media (prefers-reduced-motion:reduce){.sk-en{transition:none}}
@media (max-width:1199px) and (min-width:768px){
  .sk-row{grid-template-columns:200px minmax(0,1fr);column-gap:40px}
  .sk-meta{grid-row:auto}
}
@media (max-width:767px){
  .sk-row{grid-template-columns:1fr;row-gap:12px}
  .sk-meta{gap:14px}
  .sk-items{font-size:15px}
  .sk-items-in{margin-left:-1.5em}
  .sk-item::before{width:1.5em}
}
/* v5.18 — work list hover: nothing reflows.
   Before, hover added padding (text re-wrapped, row grew) and the peek image joined the layout.
   Now content slides with transform and the image floats on top, so the row keeps its height
   and every hover animation runs on the GPU. */
@media (hover:hover) and (min-width:768px){
  .pi,.pi:hover{padding-left:8px;padding-right:8px}
  .pi{transition:background .3s}
  .pi::before{width:100%;transform:scaleX(0);transform-origin:left;transition:transform .45s cubic-bezier(.22,1,.36,1)}
  .pi:hover::before{width:100%;transform:scaleX(1)}
  .pi > .pi-num,.pi > .pi-num + div{transition:transform .45s cubic-bezier(.22,1,.36,1)}
  .pi:hover > .pi-num,.pi:hover > .pi-num + div{transform:translateX(16px)}
  .pi .pi-peek{
    display:block;position:absolute;right:120px;top:50%;
    height:108%;width:auto;max-width:none;margin:0;
    grid-area:auto;pointer-events:none;z-index:3;
    opacity:0;transform:translate3d(18px,-50%,0) rotate(3deg);
    transition:opacity .3s ease,transform .5s cubic-bezier(.22,1,.36,1);
  }
  .pi:hover .pi-peek{opacity:1;transform:translate3d(0,-50%,0) rotate(0deg)}
}
@media (hover:hover) and (min-width:768px) and (prefers-reduced-motion:reduce){
  .pi::before,.pi > .pi-num,.pi > .pi-num + div,.pi .pi-peek{transition:opacity .2s}
  .pi:hover > .pi-num,.pi:hover > .pi-num + div{transform:none}
  .pi .pi-peek,.pi:hover .pi-peek{transform:translate3d(0,-50%,0)}
}
/* v5.21 — home: hero and work list are two snap stops. Native scrolling does the work,
   so inertia can't overshoot into a page switch and scrolling up always returns to the hero. */
@media (min-width:768px){
  .main:has(.home-work){scroll-snap-type:y mandatory}
  .page > .hero{scroll-snap-align:start;scroll-snap-stop:always}
  .home-work{scroll-snap-align:start;scroll-snap-stop:always;scroll-margin-top:0;padding-top:120px;min-height:100dvh}
}
/* v5.22 — About: the four numbers live under the intro text, left-aligned with it */
.av4-info .av4-stats{margin:0;padding:28px 0;gap:16px}
.av4-info .av4-stat{align-items:flex-start}
/* v5.23 — skills: on wide screens each row's items run on one line (the two halves sit side by side) */
@media (min-width:1200px){
  .sk-items{display:flex;flex-wrap:wrap}
  .sk-items-in{flex-wrap:nowrap}
  .sk-items-in + .sk-items-in{margin-left:0;margin-top:0}
}
/* v5.24 — process: the lower steps (定義 / 交付) sit clear of the centre line, mirroring the gap above it */
@media (min-width:768px){
  .zz-step.bottom .zz-step-content > :not(.zz-dot){position:relative;top:24px}
  .zigzag{margin-bottom:24px}
}

<form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>

<script type="text/babel">
const {useState, useEffect, useRef, useMemo} = React;

// ══════════════════════════════
// I18N — 中文為主，小標語維持英文
// ══════════════════════════════
const LangCtx = React.createContext('zh');
const useT = () => {

  // t(中文, English, 日本語?) — Japanese falls back to the JA dictionary (keyed by the English text)
  const t = (zh, en, ja) => {

    if (lang === 'ja') return ja !== undefined ? ja : (typeof en === 'string' && JA[en] !== undefined ? JA[en] : en);
    return zh;
  };
  return { lang, t };
};
const LANGS = [
  { id: 'zh', name: '繁體中文', html: 'zh-Hant-TW' },
  { id: 'en', name: 'English', html: 'en' },
  { id: 'ja', name: '日本語', html: 'ja' },
];
const JA = {
  'Enlarge: ': '拡大表示：',
  'Image viewer': '画像ビューア',
  'Close': '閉じる',
  'Swipe sideways or pinch to zoom': '左右にスワイプ、ピンチで拡大できます',
  'Pain point': '課題',
  'Solution': '解決策',
  'Other Projects': 'その他の作品',
  'Back to Work': '作品一覧へ戻る',
  '← Back to Work': '← 作品一覧へ戻る',
  'Explore My Work': '作品を見る',
  'A collection of design journeys, each refined through curiosity and care.': 'ひとつひとつの作品は、曖昧さから明快さへと向かう思考の過程です。',
